<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>城市要地防空推演 · 公开防务复盘</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body><div id="jsError" style="position:fixed;top:0;left:0;right:0;background:#ff0040;color:white;padding:8px;font-size:13px;z-index:99999;display:none;font-family:monospace;white-space:pre-wrap"></div>
<script>
window.addEventListener('error', function(e) {
    var el = document.getElementById('jsError');
    if (!el) return;
    el.style.display = 'block';
    el.textContent += '\n' + (e.message || e.error || '未知错误');
    e.preventDefault();
});
</script>
    <div class="app">
        <!-- 顶部导航栏 56px -->
        <div class="topbar">
            <a class="back-home-btn" href="../index.html" aria-label="返回主页">← 返回主页</a>
            <div class="brand-mark">
                <span class="brand-dot"></span>
                <div>
                    <div class="brand-name">防空态势复盘</div>
                    <div class="brand-kicker">2025 · 城市要地防空推演</div>
                </div>
            </div>
            <div class="tab-nav">
                <div class="tab-btn active" data-tab="combat"><span>防空推演</span><em>城市要地</em></div>
                <div class="tab-btn" data-tab="science"><span>装备百科</span><em>公开资料</em></div>
            </div>
            <div class="top-actions">
                <button type="button" class="top-action audio-toggle" aria-label="静音"><span></span> 静音</button>
                <button type="button" class="top-action share-action" aria-label="分享">分享 ↗</button>
            </div>
        </div>

        <!-- 主内容区 -->
        <div class="main-area">

            <!-- ====== 作战模拟 ====== -->
            <div class="tab-content active" id="combat">
                <div class="combat-layout">

                    <!-- 左侧面板 -->
                    <div class="side-panel left-panel">
                        <div class="panel-section equip-section">
                            <div class="section-title">部署防空装备</div>
                            <div class="equip-list">
                                <div class="equip-item" data-type="gun">⊙ 近防炮 <span>近程末端拦截</span></div>
                                <div class="equip-item" data-type="missile">△ 防空导弹 <span>区域防空拦截</span></div>
                                <div class="equip-item" data-type="radar">◈ 预警雷达 <span>空情预警探测</span></div>
                            </div>
                            <div class="cancel-section">
                                <button id="btnSelectMode">✕ 取消部署</button>
                            </div>
                            <!-- 型号选择面板（内嵌） -->
                            <div class="model-panel" id="modelPanel">
                                <div class="model-header">
                                    <span class="model-title">选择装备型号</span>
                                    <span class="model-close" id="closeModelPanel">✕</span>
                                </div>
                                <div class="model-list" id="modelList"></div>
                            </div>
                        </div>

                        <div class="panel-divider"></div>

                       <div class="panel-section">
                           <div class="section-title">指挥控制</div>
                            <button id="btnStart" class="btn-primary">▶ 开始推演</button>
                            <button id="btnSpeed" class="speed-toggle" type="button" aria-pressed="false">⏩ 倍速：1x</button>
                            <button id="btnReset">↻ 重置航图</button>
                        </div>

                        <div class="panel-divider"></div>

                        <div class="panel-section">
                            <div class="section-title">防御阵型</div>
                            <button id="btnAuto1" class="btn-plan">◎ 基础防御</button>
                            <button id="btnAuto2" class="btn-plan">◈ 均衡防御</button>
                            <button id="btnAuto3" class="btn-plan">◇ 反隐身防御</button>
                            <button id="btnAuto4" class="btn-plan">◉ 密集火力</button>
                        </div>
                    </div>

                    <!-- 中央画布 -->
                    <div class="canvas-box">
                        <div class="surface-noise"></div>
                        <div class="ocean-hero-copy">
                            <span>防空推演 · 2025复盘</span>
                            <strong>城市防空推演</strong>
                        </div>
                        <div class="voyage-meta">
                            <span>指挥中心在线</span>
                            <span>空域雷达实时</span>
                        </div>
                        <canvas id="gameCanvas" width="900" height="600"></canvas>
                        <div class="canvas-tools">
                            <label class="switch-item"><input type="checkbox" id="toggleRange" checked> 显示射程范围</label>
                        </div>
                        <div class="canvas-hint">
                            左键部署装备 · 右键删除 · 拖动调整 · 1/2/3 切换装备 · 空格开始 · V 切换倍速
                        </div>
                    </div>

                    <!-- 右侧面板 -->
                    <div class="side-panel right-panel">
                        <div class="sub-tab-nav">
                            <div class="sub-tab-btn active" data-subtab="stats">战斗记录</div>
                            <div class="sub-tab-btn" data-subtab="enemy-info">目标情报</div>
                        </div>

                        <div class="sub-tab-content active" id="subtab-stats">
                            <div class="section-title">战场统计</div>
                            <div class="data-list">
                                <div class="data-row"><span>来袭目标</span><span id="dataTotal">0</span></div>
                                <div class="data-row"><span>已拦截</span><span id="dataKill">0</span></div>
                                <div class="data-row"><span>突防成功</span><span id="dataBreak">0</span></div>
                               <div class="data-row"><span>拦截成功率</span><span id="dataRate">0%</span></div>
                           </div>
                            <div class="score-area">
                                <span>防空评分</span>
                                <span id="dataScore">0</span>
                            </div>
                        </div>

                        <div class="sub-tab-content" id="subtab-enemy-info">
                            <div class="section-title">威胁情报</div>
                            <div class="enemy-info-list" id="enemyInfoList"></div>
                        </div>
                    </div>

                </div><!-- /.combat-layout -->
                <div class="equip-tooltip" id="equipTooltip"></div>
            </div><!-- /#combat -->

            <!-- ====== 国防科普 ====== -->
            <div class="tab-content" id="science">
                <div class="science-layout">
                    <div class="science-side">
                        <div class="section-title">装备章节</div>
                        <div class="science-nav-list" id="scienceNavList"></div>
                    </div>
                    <div class="science-main">
                        <div class="science-content" id="scienceContent"></div>
                    </div>
                </div>
            </div>

        </div><!-- /.main-area -->
    </div><!-- /.app -->

    <script src="js/scienceData.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/data.js"></script>
    <script src="js/map.js"></script>
    <script src="js/equipment.js"></script>
    <script src="js/enemy.js"></script>
    <script src="js/combat.js"></script>
    <script src="js/effect.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
