<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>中国防务观察 · 现代国防装备专题索引</title>
<style>
/* ====== 中文防务简报设计系统 ====== */
:root{
  --bg:#f4f3ef;
  --paper:#fffdfa;
  --paper-strong:#ffffff;
  --ink:#111817;
  --ink-soft:#26312f;
  --muted:#68736f;
  --muted-2:#8b9691;
  --line:#ddd8cf;
  --line-soft:#ece7dd;
  --accent:#8f2f22;
  --accent-dark:#5f1f18;
  --accent-soft:#f4e5df;
  --steel:#3f5158;
  --shadow-soft:0 18px 50px rgba(20,28,25,.08);
  --shadow-card:0 22px 56px rgba(20,28,25,.12);
  --radius-lg:24px;
  --radius-md:16px;
  --radius-sm:10px;
  --motion-fast:180ms cubic-bezier(.2,.8,.2,1);
  --motion-smooth:380ms cubic-bezier(.2,.8,.2,1);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;font-size:16px}
body{font-family:"Microsoft YaHei","PingFang SC","Noto Sans SC",system-ui,sans-serif;background:radial-gradient(circle at top left,rgba(143,47,34,.08),transparent 30rem),var(--bg);color:var(--ink);line-height:1.75;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body.menu-open,body.modal-open{overflow:hidden}
button,input{font:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid rgba(143,47,34,.32);outline-offset:4px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

/* ====== 顶部栏 ====== */
.topbar{position:sticky;top:0;z-index:50;background:rgba(255,253,250,.92);backdrop-filter:blur(18px);border-bottom:1px solid var(--line);display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:22px;padding:0 34px;min-height:68px;box-shadow:0 1px 0 rgba(17,24,23,.02)}
.topbar-brand{display:flex;align-items:baseline;gap:10px;color:var(--ink);white-space:nowrap;letter-spacing:-.03em}
.topbar-brand span:first-child{width:10px;height:10px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 6px rgba(143,47,34,.1);font-size:0;flex-shrink:0}
.topbar-brand .txt{font-family:"Noto Serif SC","Songti SC","SimSun",serif;font-size:1.15rem;font-weight:800}
.topbar-brand::after{content:"防务简报";font-size:.62rem;letter-spacing:.18em;color:var(--muted-2);margin-left:4px}
.topbar-nav{display:flex;align-items:center;justify-content:center;gap:4px;overflow-x:auto;scrollbar-width:none}
.topbar-nav::-webkit-scrollbar{display:none}
.nav-link{position:relative;padding:8px 15px;border:1px solid transparent;border-radius:999px;background:transparent;color:var(--muted);font-size:.86rem;font-weight:650;white-space:nowrap;transition:color var(--motion-fast),background-color var(--motion-fast),border-color var(--motion-fast),transform var(--motion-fast)}
.nav-link:hover{color:var(--ink);background:#f0ece4;border-color:var(--line-soft);transform:translateY(-1px)}
.nav-link.active,.nav-link[aria-current="page"]{color:#fff;background:var(--ink);border-color:var(--ink);box-shadow:0 10px 24px rgba(17,24,23,.12)}
.topbar-actions{display:flex;align-items:center;gap:10px;justify-content:flex-end}
.topbar-search{display:flex;align-items:center;gap:8px;background:#f6f2eb;border:1px solid transparent;border-radius:999px;padding:8px 14px;transition:border-color var(--motion-fast),background-color var(--motion-fast),box-shadow var(--motion-fast);min-width:220px}
.topbar-search:focus-within{border-color:rgba(143,47,34,.45);background:#fff;box-shadow:0 10px 28px rgba(143,47,34,.08)}
.topbar-search input{border:none;outline:none;background:transparent;font-size:.86rem;width:170px;color:var(--ink)}
.topbar-search input::placeholder{color:var(--muted-2)}
.topbar-search svg{width:16px;height:16px;color:var(--muted-2);flex-shrink:0}
.clear-search{width:24px;height:24px;border:none;border-radius:50%;background:transparent;color:var(--muted-2);display:none;align-items:center;justify-content:center;transition:background-color var(--motion-fast),color var(--motion-fast),transform var(--motion-fast)}
.clear-search.visible{display:flex}
.clear-search:hover{background:var(--accent-soft);color:var(--accent);transform:rotate(90deg)}
.topbar-toggle{display:none;background:#fff;border:1px solid var(--line);border-radius:999px;width:40px;height:40px;color:var(--ink);font-size:1.1rem;align-items:center;justify-content:center;transition:transform var(--motion-fast),box-shadow var(--motion-fast),background-color var(--motion-fast)}
.topbar-toggle:hover{transform:translateY(-1px);box-shadow:0 12px 26px rgba(20,28,25,.1)}

/* ====== 主视觉 ====== */
.hero{position:relative;overflow:hidden;background:linear-gradient(135deg,#161d1b 0%,#243233 58%,#4e211b 100%);color:#fff;padding:78px 32px 68px;border-bottom:1px solid rgba(255,255,255,.08)}
.hero::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(0deg,rgba(255,255,255,.028) 1px,transparent 1px);background-size:48px 48px;mask-image:linear-gradient(180deg,#000,transparent 85%)}
.hero::after{content:"";position:absolute;width:520px;height:520px;border:1px solid rgba(255,255,255,.08);border-radius:50%;right:-180px;top:-190px;box-shadow:0 0 0 70px rgba(255,255,255,.018),0 0 0 140px rgba(255,255,255,.012)}
.hero-content{position:relative;z-index:1;max-width:980px;margin:0 auto;animation:heroIn .62s var(--motion-smooth) both}
@keyframes heroIn{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
.hero-kicker{display:inline-flex;align-items:center;gap:10px;font-size:.75rem;letter-spacing:.22em;text-transform:uppercase;color:rgba(255,255,255,.68);margin-bottom:18px;border:1px solid rgba(255,255,255,.18);padding:6px 16px;border-radius:999px;background:rgba(255,255,255,.06);backdrop-filter:blur(10px)}
.hero-kicker::before{content:"";width:7px;height:7px;border-radius:50%;background:#d96652;box-shadow:0 0 18px rgba(217,102,82,.85)}
.hero h1{font-family:"Noto Serif SC","Songti SC","SimSun",serif;font-size:clamp(2.1rem,5vw,4.8rem);font-weight:900;line-height:1.08;letter-spacing:-.05em;max-width:760px;margin-bottom:18px}
.hero p{font-size:1.05rem;color:rgba(255,255,255,.72);max-width:650px;line-height:1.9;margin-bottom:34px}
.hero-stats{display:flex;gap:12px;flex-wrap:wrap}
.hero-stat{text-align:left;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);padding:13px 18px;border-radius:16px;min-width:120px;backdrop-filter:blur(12px)}
.hero-stat .num{font-size:1.65rem;line-height:1;font-weight:850;color:#fff;letter-spacing:-.04em}
.hero-stat .label{font-size:.72rem;color:rgba(255,255,255,.52);margin-top:8px;letter-spacing:.08em}

/* ====== 主内容 ====== */
.main-wrap{max-width:1260px;margin:0 auto;padding:34px 24px 68px}
.results-bar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:20px;padding:16px 18px;border:1px solid var(--line-soft);background:rgba(255,253,250,.72);border-radius:var(--radius-md);box-shadow:0 12px 34px rgba(20,28,25,.04)}
.results-title{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.results-title strong{font-family:"Noto Serif SC","Songti SC","SimSun",serif;font-size:1.15rem;color:var(--ink)}
.results-title span{font-size:.86rem;color:var(--muted)}
.results-hint{font-size:.78rem;color:var(--muted-2)}
.cat-heading{display:flex;align-items:center;gap:10px;margin:26px 0 8px;padding:8px 2px 12px;border-bottom:1px solid var(--line)}
.cat-heading .icon{font-size:1.05rem;filter:saturate(.7)}
.cat-heading h2{font-family:"Noto Serif SC","Songti SC","SimSun",serif;font-size:1.22rem;font-weight:800;color:var(--ink)}
.cat-heading .count{font-size:.76rem;color:var(--muted);background:#ebe6dd;padding:3px 11px;border-radius:999px}
.cards-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:18px;transition:opacity var(--motion-smooth),transform var(--motion-smooth),filter var(--motion-smooth)}
.cards-grid.is-filtering{opacity:.28;transform:translateY(10px);filter:blur(1px)}
.card{position:relative;background:var(--paper);border:1px solid var(--line-soft);border-radius:var(--radius-lg);overflow:hidden;cursor:pointer;min-height:100%;box-shadow:0 1px 0 rgba(17,24,23,.02);transition:transform var(--motion-smooth),box-shadow var(--motion-smooth),border-color var(--motion-fast),background-color var(--motion-fast);opacity:0;animation:cardIn .48s var(--motion-smooth) forwards;animation-delay:var(--delay,0ms)}
@keyframes cardIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.card::before{content:"";position:absolute;left:18px;right:18px;top:0;height:2px;background:linear-gradient(90deg,transparent,var(--accent),transparent);transform:scaleX(0);transform-origin:left;transition:transform .46s var(--motion-smooth);z-index:2}
.card:hover,.card:focus-visible{transform:translateY(-6px);box-shadow:var(--shadow-card);border-color:#d5ccc0;background:#fff}
.card:hover::before,.card:focus-visible::before{transform:scaleX(1)}
.card:active,.card.is-pressed{transform:translateY(-2px) scale(.985)}
.card-img{position:relative;height:150px;overflow:hidden;background:#ece7dd;border-bottom:1px solid var(--line-soft)}
.card-img svg{width:100%;height:100%;display:block;transition:transform .7s var(--motion-smooth),filter .7s var(--motion-smooth);filter:saturate(.78) contrast(.98)}
.card:hover .card-img svg{transform:scale(1.035);filter:saturate(.95) contrast(1.02)}
.card-cat{position:absolute;top:14px;left:14px;z-index:1;padding:6px 12px;border-radius:999px;font-size:.72rem;background:rgba(17,24,23,.72);color:#fff;backdrop-filter:blur(8px);font-weight:700;letter-spacing:.02em}
.card-body{padding:20px 22px 22px}
.card-eyebrow{font-size:.72rem;color:var(--accent);font-weight:800;letter-spacing:.12em;text-transform:uppercase;margin-bottom:8px}
.card-body h3{font-family:"Noto Serif SC","Songti SC","SimSun",serif;font-size:1.28rem;font-weight:900;color:var(--ink);line-height:1.32;margin-bottom:7px;letter-spacing:-.03em}
.card-body .model{font-size:.82rem;color:var(--muted-2);margin-bottom:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-body .excerpt{font-size:.9rem;color:var(--muted);line-height:1.75;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.card-meta{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:18px;padding-top:15px;border-top:1px solid var(--line-soft);font-size:.78rem;color:var(--muted)}
.card-meta span:last-child{color:var(--accent);font-weight:800;transition:transform var(--motion-fast)}
.card:hover .card-meta span:last-child{transform:translateX(4px)}
.no-results{text-align:center;padding:82px 20px;color:var(--muted);border:1px dashed var(--line);border-radius:var(--radius-lg);background:rgba(255,253,250,.58)}
.no-results .icon{font-size:2.8rem;margin-bottom:14px;filter:saturate(.72)}
.no-results h3{font-family:"Noto Serif SC","Songti SC","SimSun",serif;font-size:1.3rem;color:var(--ink);margin-bottom:8px}

/* ====== 详情弹窗 ====== */
.modal-overlay{position:fixed;inset:0;z-index:100;background:rgba(17,24,23,.72);backdrop-filter:blur(10px);display:flex;align-items:center;justify-content:center;padding:24px;visibility:hidden;opacity:0;pointer-events:none;transition:opacity var(--motion-smooth),visibility var(--motion-smooth)}
.modal-overlay.show{visibility:visible;opacity:1;pointer-events:auto}
.modal{background:var(--paper-strong);border-radius:26px;width:100%;max-width:940px;max-height:88vh;max-height:88dvh;overflow-y:auto;box-shadow:0 34px 92px rgba(0,0,0,.32);transform:translateY(28px) scale(.985);opacity:0;transition:transform var(--motion-smooth),opacity var(--motion-smooth);position:relative;border:1px solid rgba(255,255,255,.45)}
.modal-overlay.show .modal{transform:translateY(0) scale(1);opacity:1}
.modal::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:linear-gradient(90deg,transparent,var(--accent),transparent);opacity:.9}
.modal-close{position:sticky;top:18px;float:right;z-index:10;width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.86);border:1px solid var(--line);color:var(--ink);font-size:1.05rem;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:transform var(--motion-fast),background-color var(--motion-fast),color var(--motion-fast),border-color var(--motion-fast);margin:18px 18px -60px auto;box-shadow:0 12px 28px rgba(20,28,25,.1)}
.modal-close:hover{background:var(--accent);border-color:var(--accent);color:#fff;transform:rotate(90deg)}
.modal-img-wrap{position:relative;width:100%;height:300px;overflow:hidden;background:#ece7dd;border-radius:26px 26px 0 0;border-bottom:1px solid var(--line-soft)}
.modal-img-wrap svg{width:100%;height:100%;display:block;filter:saturate(.82)}
.modal-body{padding:30px 38px 40px}
.modal-tags{margin-bottom:14px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.modal-tag,.modal-status{padding:6px 13px;border-radius:999px;font-size:.76rem;font-weight:800;border:1px solid var(--line-soft)}
.modal-tag{background:#f4f0e8;color:var(--steel)}
.tag-active{background:#e8f3ea;color:#2d6e40;border-color:#cfe5d5}
.tag-test{background:#fff4da;color:#a16207;border-color:#efd38f}
.modal-body h2{font-family:"Noto Serif SC","Songti SC","SimSun",serif;font-size:clamp(1.8rem,4vw,2.8rem);font-weight:900;color:var(--ink);line-height:1.16;letter-spacing:-.04em;margin-bottom:8px}
.modal-body .model-name{font-size:1rem;color:var(--muted);margin-bottom:24px}
.specs-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:1px;margin-bottom:26px;background:var(--line);border-radius:16px;overflow:hidden;border:1px solid var(--line)}
.spec-item{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 14px;background:#fffdf9;font-size:.86rem}
.spec-label{color:var(--muted);font-weight:700;flex-shrink:0}
.spec-value{color:var(--ink);font-weight:750;text-align:right;word-break:break-word}
.radar-block{display:grid;grid-template-columns:300px minmax(260px,1fr);gap:26px;align-items:center;margin:24px 0 28px;padding:24px;background:linear-gradient(135deg,#f7f3ec 0%,#fffdf9 56%,#efe8dc 100%);border-radius:22px;border:1px solid #ded5c8;box-shadow:inset 0 1px 0 rgba(255,255,255,.72),0 18px 42px rgba(20,28,25,.07)}
.radar-canvas-wrap{position:relative;flex-shrink:0;justify-self:center;width:286px;height:286px;display:flex;align-items:center;justify-content:center;border-radius:50%;background:radial-gradient(circle,rgba(143,47,34,.06),transparent 62%)}
.radar-canvas-wrap::before{content:"";position:absolute;inset:20px;border-radius:50%;border:1px dashed rgba(63,81,88,.22)}
.radar-canvas-wrap canvas{position:relative;z-index:1;display:block;max-width:100%}
.radar-info{flex:1;min-width:220px}
.radar-info h4{font-size:.96rem;color:var(--ink);margin-bottom:6px;font-weight:900;letter-spacing:.05em}
.radar-note{font-size:.76rem;color:var(--muted-2);margin-bottom:16px;line-height:1.7}
.radar-row{display:grid;grid-template-columns:10px 76px minmax(90px,1fr) 48px;align-items:center;gap:9px;margin-bottom:10px;font-size:.83rem}
.radar-row .dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;box-shadow:0 0 0 4px rgba(143,47,34,.08)}
.radar-row .lbl{color:var(--ink-soft);font-weight:750;white-space:nowrap}
.radar-row .bar-wrap{position:relative;height:9px;border-radius:999px;background:#e2ddd4;overflow:hidden;box-shadow:inset 0 1px 2px rgba(20,28,25,.08)}
.radar-row .bar-fill{height:100%;border-radius:999px;transition:width .8s var(--motion-smooth);box-shadow:0 0 18px currentColor}
.radar-row .val{font-family:ui-monospace,SFMono-Regular,Consolas,"Liberation Mono",monospace;font-weight:900;color:var(--ink);text-align:right;flex-shrink:0}
.radar-row .val::after{content:"/100";font-size:.62rem;color:var(--muted-2);font-weight:700;margin-left:1px}
.source-open-btn{margin-left:auto;border:1px solid rgba(143,47,34,.26);background:var(--accent-soft);color:var(--accent-dark);padding:7px 13px;border-radius:999px;font-size:.76rem;font-weight:850;transition:transform var(--motion-fast),background-color var(--motion-fast),border-color var(--motion-fast)}
.source-open-btn:hover{transform:translateY(-1px);background:#fff1ea;border-color:rgba(143,47,34,.42)}
.source-panel{margin:0 0 22px;padding:16px;border:1px solid #ead8cf;border-radius:18px;background:#fff8f4;box-shadow:0 18px 46px rgba(143,47,34,.08)}
.source-panel[hidden]{display:none}
.source-panel-head{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;margin-bottom:12px}
.source-panel-head h4{font-family:"Noto Serif SC","Songti SC","SimSun",serif;font-size:1rem;color:var(--ink);font-weight:900}
.source-panel-head p{font-size:.78rem;color:var(--muted);line-height:1.7;margin-top:3px}
.source-panel-close{width:30px;height:30px;border-radius:50%;border:1px solid rgba(143,47,34,.22);background:#fff;color:var(--accent);font-weight:900;flex-shrink:0}
.source-list{display:grid;gap:9px}
.source-link{display:grid;grid-template-columns:1fr auto;gap:8px 14px;align-items:center;padding:11px 12px;border:1px solid rgba(143,47,34,.12);border-radius:14px;background:#fff;text-decoration:none;transition:transform var(--motion-fast),border-color var(--motion-fast),box-shadow var(--motion-fast)}
.source-link:hover{transform:translateY(-1px);border-color:rgba(143,47,34,.34);box-shadow:0 12px 24px rgba(143,47,34,.08);text-decoration:none}
.source-link strong{font-size:.86rem;color:var(--ink);line-height:1.45}
.source-link span{grid-column:1/-1;font-size:.76rem;color:var(--muted);line-height:1.55}
.source-link em{font-style:normal;color:var(--accent);font-weight:900;font-size:.78rem;white-space:nowrap}
.desc-block{border-top:1px solid var(--line-soft);padding-top:6px}
.desc-block h4{font-family:"Noto Serif SC","Songti SC","SimSun",serif;font-size:1.05rem;color:var(--ink);margin:18px 0 8px;font-weight:900}
.desc-block p{font-size:.94rem;color:var(--ink-soft);line-height:1.95;margin-bottom:12px;text-indent:2em}
.footer{text-align:center;padding:38px 20px;border-top:1px solid var(--line);color:var(--muted-2);font-size:.78rem;line-height:2.2;background:rgba(255,253,250,.8)}
.btt{position:fixed;bottom:28px;right:28px;z-index:45;width:44px;height:44px;border-radius:50%;background:#fff;border:1px solid var(--line);color:var(--muted);cursor:pointer;font-size:1rem;display:flex;align-items:center;justify-content:center;transition:opacity var(--motion-fast),transform var(--motion-fast),background-color var(--motion-fast),color var(--motion-fast),border-color var(--motion-fast);opacity:0;pointer-events:none;box-shadow:0 12px 28px rgba(20,28,25,.1)}
.btt.visible{opacity:1;pointer-events:auto}
.btt:hover{background:var(--ink);color:#fff;border-color:var(--ink);transform:translateY(-3px)}


/* ====== 离线媒体图库 ====== */
.card-img img{width:100%;height:100%;display:block;object-fit:cover;transition:transform .7s var(--motion-smooth),filter .7s var(--motion-smooth);filter:saturate(.82) contrast(.98)}
.card:hover .card-img img{transform:scale(1.035);filter:saturate(.96) contrast(1.02)}
.card-media-badge{position:absolute;right:12px;top:12px;z-index:1;padding:6px 10px;border-radius:999px;background:rgba(255,253,250,.86);color:var(--ink);font-size:.68rem;font-weight:850;box-shadow:0 10px 22px rgba(20,28,25,.12);backdrop-filter:blur(10px)}
.modal-media{border-bottom:1px solid var(--line-soft);background:#f7f3ec;border-radius:26px 26px 0 0;overflow:hidden}
.media-stage{position:relative;min-height:380px;aspect-ratio:16/9;max-height:min(430px,52dvh);background:#151d1b;display:flex;align-items:center;justify-content:center;overflow:hidden}
.media-stage img,.media-stage video{width:100%;height:100%;max-height:min(430px,52dvh);object-fit:cover;display:block;background:#151d1b}
.media-stage video{object-fit:contain;background:#0f1413}
.media-missing{width:100%;min-height:380px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#fff;background:linear-gradient(135deg,#151d1b,#4e211b);padding:34px}
.media-missing img{width:100%;height:100%;position:absolute;inset:0;object-fit:cover;opacity:.36;filter:saturate(.7)}
.media-missing strong,.media-missing span{position:relative;z-index:1}
.media-missing strong{font-family:"Noto Serif SC","Songti SC","SimSun",serif;font-size:1.4rem;margin-bottom:8px}
.media-missing span{font-size:.9rem;color:rgba(255,255,255,.72)}
.media-missing a{position:relative;z-index:1;margin-top:16px;padding:9px 16px;border-radius:999px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.28);color:#fff;text-decoration:none;font-size:.86rem;font-weight:800;transition:background-color var(--motion-fast),transform var(--motion-fast)}
.media-missing a:hover{background:rgba(255,255,255,.24);transform:translateY(-1px)}
.media-thumbs{display:flex;gap:10px;padding:14px 16px;overflow-x:auto;background:rgba(255,253,250,.9);scrollbar-width:thin}

function normalizeText(value){return String(value||'').toLowerCase().replace(/\s+/g,'').trim()}
function flattenSearchText(value){
  if(Array.isArray(value))return value.map(flattenSearchText).join(' ');
  if(value&&typeof value==='object')return Object.keys(value).map(function(k){return k+' '+flattenSearchText(value[k])}).join(' ');
  return value==null?'':String(value);
}
function getSearchText(x){
  var m=catMeta[x.c]||{name:x.c,icon:''};
  var status=x.s==='active'?'现役':'测试中';
  return flattenSearchText([x.n,x.fn,x.c,m.name,status,x.sp,x.ds]);
}
function findItemById(id){for(var i=0;i<E.length;i++){if(E[i].id===id)return E[i]}return null}
function currentCatName(){return state.category==='all'?'全部频道':((catMeta[state.category]&&catMeta[state.category].name)||state.category)}
function safeClosest(el,selector){while(el&&el.nodeType===1){if(el.matches&&el.matches(selector))return el;el=el.parentElement}return null}
function escapeHtml(value){return String(value==null?'':value).replace(/[&<>"']/g,function(ch){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]})}
function getSources(x){return sourceCatalog[x.id]||[]}
function buildSourcePanel(x){
  var sources=getSources(x);
  if(!sources.length)return '';
  var links=sources.map(function(s){return '<a class="source-link" href="'+escapeHtml(s.url)+'" target="_blank" rel="noopener noreferrer"><strong>'+escapeHtml(s.name)+'</strong><em>打开来源 ↗</em><span>'+escapeHtml(s.note||'公开资料来源')+'</span></a>'}).join('');
  return '<section class="source-panel" id="sourcePanel" hidden><div class="source-panel-head"><div><h4>公开数据来源</h4><p>以下链接用于核对装备参数、入列节点与公开报道表述。五维评分为基于公开信息的专题化展示，并非官方战术评估。</p></div><button class="source-panel-close" type="button" data-source-close aria-label="关闭来源列表">×</button></div><div class="source-list">'+links+'</div></section>';
}

var IMAGE_PLACEHOLDER='assets/shared/placeholders/image-placeholder.svg';
var VIDEO_PLACEHOLDER='assets/shared/placeholders/video-placeholder.svg';
function getMedia(id){return window.EQUIPMENT_MEDIA&&window.EQUIPMENT_MEDIA[id]?window.EQUIPMENT_MEDIA[id]:null}
function normalizeMediaStatus(status){return status==='ready'?'verified':(status==='placeholder'?'fallback':status)}
function fallbackImage(x,index){return {src:IMAGE_PLACEHOLDER,alt:x.n+' 图片槽位 '+(index+1)+'（暂无官方公开图片）',caption:'图片 '+(index+1)+' · 暂无官方公开素材',sourceName:'本地占位',sourceUrl:'',status:'fallback',slot:index+1}}
function getMediaImages(x){
  var media=getMedia(x.id),imgs=media&&Array.isArray(media.images)?media.images.slice(0,7):[];
  for(var i=imgs.length;i<7;i++)imgs.push(fallbackImage(x,i));
  return imgs.map(function(img,i){return Object.assign(fallbackImage(x,i),img||{})});
}
function getMediaVideo(x){
  var media=getMedia(x.id),v=media&&media.video?media.video:{};
  return Object.assign({src:'',poster:VIDEO_PLACEHOLDER,title:x.n+' 官方公开视频槽位',sourceName:'本地占位',sourceUrl:'',status:'fallback',note:'暂无官方公开视频素材'},v);
}
function realImageCount(x){return getMediaImages(x).filter(function(img){var s=normalizeMediaStatus(img.status);return s!=='fallback'&&s!=='missing'}).length}
function hasRealVideo(x){var v=getMediaVideo(x),s=normalizeMediaStatus(v.status);return !!(v.src&&s!=='fallback'&&s!=='missing')}
function hasWebVideo(x){var v=getMediaVideo(x),s=normalizeMediaStatus(v.status);return !!(!v.src&&s==='web_only'&&v.sourceUrl)}
function mediaBadgeText(x){return realImageCount(x)+' / 7 图 · '+(hasRealVideo(x)?'1 视频':(hasWebVideo(x)?'网页视频':'暂无视频'))}
function imgTag(img,cls){return '<img class="'+(cls||'media-img')+'" src="'+escapeHtml(img.src||IMAGE_PLACEHOLDER)+'" alt="'+escapeHtml(img.alt||img.caption||'装备图片')+'" loading="lazy" decoding="async" onerror="this.onerror=null;this.src=\''+IMAGE_PLACEHOLDER+'\';">'}
function mediaSourceHtml(item,type){
  var statusMap={
    verified:'已审核官方/央媒素材',
    ready:'已下载公开来源素材',
    web_only:'公开网页可观看，未下载本地视频',
    generated:'本地生成兜底素材',
    needs_review:'素材待复核',
    rejected:'来源不符合规则，未入库',
    fallback:'暂无官方公开素材，当前显示本地占位',
    placeholder:'暂无官方公开素材，当前显示本地占位',
    missing:'暂无官方公开素材，当前显示本地占位'
  };
  var status=statusMap[item.status]||statusMap.fallback;
  var src=item.sourceName?escapeHtml(item.sourceName):(item.status==='web_only'?'公开视频网页':'本地占位');
  var link=item.sourceUrl?'<a href="'+escapeHtml(item.sourceUrl)+'" target="_blank" rel="noopener noreferrer">查看来源</a>':'';
  return '<span>'+escapeHtml(type)+' · '+src+' · '+status+'</span>'+link;
}
function buildImageStage(img,x,index){return '<figure class="media-figure">'+imgTag(img,'media-img')+'</figure>'}
function buildVideoStage(video,x){
  if(video.src){return '<video controls preload="metadata" poster="'+escapeHtml(video.poster||VIDEO_PLACEHOLDER)+'" title="'+escapeHtml(video.title||x.n+' 视频')+'"><source src="'+escapeHtml(video.src)+'" type="video/mp4">当前浏览器不支持视频播放。</video>'}
  if(video.status==='web_only'&&video.sourceUrl){return '<div class="media-missing web-only"><img src="'+escapeHtml(video.poster||VIDEO_PLACEHOLDER)+'" alt="" aria-hidden="true"><strong>公开视频需联网查看</strong><span>该素材页面可匿名访问，但未找到无需鉴权、无需绕过限制的稳定本地视频文件。</span><a href="'+escapeHtml(video.sourceUrl)+'" target="_blank" rel="noopener noreferrer">打开来源视频网页</a></div>'}
  return '<div class="media-missing"><img src="'+escapeHtml(video.poster||VIDEO_PLACEHOLDER)+'" alt="" aria-hidden="true"><strong>暂无官方公开视频</strong><span>当前装备的视频槽位已保留，待补充官方或央媒公开 720p 短片。</span></div>';
}
function buildMediaGallery(x){
  var imgs=getMediaImages(x),video=getMediaVideo(x),first=imgs[0];
  var thumbs=imgs.map(function(img,i){return '<button class="media-thumb '+(i===0?'active ':'')+(normalizeMediaStatus(img.status)==='fallback'||normalizeMediaStatus(img.status)==='missing'?'fallback':'')+'" type="button" data-media-type="image" data-media-index="'+i+'" aria-label="查看第 '+(i+1)+' 张图片">'+imgTag(img,'')+'<span class="thumb-label">图 '+(i+1)+'</span></button>'}).join('');
  thumbs+='<button class="media-thumb '+(!video.src?'fallback':'')+'" type="button" data-media-type="video" data-media-index="0" aria-label="查看视频">'+imgTag({src:video.poster||VIDEO_PLACEHOLDER,alt:video.title||x.n+' 视频封面'},'')+'<span class="play-mark">▶</span><span class="thumb-label">视频</span></button>';
  return '<section class="modal-media" data-equipment-id="'+escapeHtml(x.id)+'"><div class="media-stage" id="mediaStage">'+buildImageStage(first,x,0)+'</div><div class="media-thumbs" role="listbox" aria-label="媒体缩略图">'+thumbs+'</div><div class="media-source" id="mediaSource">'+mediaSourceHtml(first,'图片 1')+'</div></section>';
}
function pauseModalVideo(){if(!mCont||!mCont.querySelectorAll)return;var videos=mCont.querySelectorAll('video');for(var i=0;i<videos.length;i++)videos[i].pause&&videos[i].pause()}
function switchModalMedia(type,index){
  var item=findItemById(state.activeModalId);if(!item)return;
  var stage=document.getElementById('mediaStage'),source=document.getElementById('mediaSource');if(!stage||!source)return;
  pauseModalVideo();

  if(type==='video'){var video=getMediaVideo(item);stage.innerHTML=buildVideoStage(video,item);sourceItem=video;label='视频'}
  else{var imgs=getMediaImages(item);var img=imgs[index]||imgs[0];stage.innerHTML=buildImageStage(img,item,index);sourceItem=img;label='图片 '+(index+1)}
  source.innerHTML=mediaSourceHtml(sourceItem,label);

// ====== FILTER ======
function filterItems(){
  var q=normalizeText(state.query);
  return E.filter(function(x){
    var matchCat=state.category==='all'||x.c===state.category;
    var matchQ=!q||normalizeText(getSearchText(x)).indexOf(q)>-1;
    return matchCat&&matchQ;
  });
}

  items=items||filterItems();
  if(renderTimer)clearTimeout(renderTimer);
  grid.classList.add('is-filtering');
  renderTimer=setTimeout(function(){
    grid.innerHTML='';
    noR.hidden=items.length!==0;
    noR.style.display=items.length?'none':'block';
    if(items.length){
      var grouped={};
      items.forEach(function(x){if(!grouped[x.c])grouped[x.c]=[];grouped[x.c].push(x)});
      if(state.category==='all'&&state.query===''){
        Object.keys(grouped).forEach(function(c){
          var h=document.createElement('div');h.className='cat-heading';h.style.gridColumn='1/-1';
          var m=catMeta[c]||{name:c,icon:''};
          h.innerHTML='<span class="icon">'+m.icon+'</span><h2>'+escapeHtml(m.name)+'</h2><span class="count">'+grouped[c].length+' 条报道</span>';
          grid.appendChild(h);
          grouped[c].forEach(function(x,i){grid.appendChild(card(x,i))});
        });
      }else{
        items.forEach(function(x,i){grid.appendChild(card(x,i))});
      }
    }
    stT.textContent=items.length;
    updateSummary(items.length);
    requestAnimationFrame(function(){grid.classList.remove('is-filtering')});
  },130);
}

function updateSummary(count){
  var q=state.query.trim();
  var summary='当前显示 '+count+' 条 · '+currentCatName();
  if(q)summary='搜索“'+q+'” · '+currentCatName()+' · '+count+' 条结果';
  if(resultSummary)resultSummary.textContent=summary;
  if(clearSearch)clearSearch.classList.toggle('visible',!!q);
}

function card(x,i){
  var d=document.createElement('article');
  d.className='card';
  d.setAttribute('role','button');
  d.setAttribute('tabindex','0');
  d.setAttribute('data-id',x.id);
  d.setAttribute('aria-label','查看 '+x.n+' 详情');
  d.style.setProperty('--delay',(i*35)+'ms');
  var m=catMeta[x.c]||{name:x.c,icon:''},primary=getMediaImages(x)[0];
  d.innerHTML='<div class="card-img"><div class="card-cat">'+m.icon+' '+escapeHtml(m.name)+'</div><div class="card-media-badge">'+mediaBadgeText(x)+'</div>'+imgTag(primary,'media-img')+'</div>'+
    '<div class="card-body"><div class="card-eyebrow">装备档案</div><h3>'+escapeHtml(x.n)+'</h3><div class="model">'+escapeHtml(x.fn)+'</div>'+
    '<div class="excerpt">'+escapeHtml(x.ds[0])+'</div>'+
    '<div class="card-meta"><span>'+escapeHtml(m.name)+' · 离线媒体</span><span>查看详情 →</span></div></div>';
  return d;
}

// ====== RADAR ======
function drawRadar(canvas,labels,scores,color){
  var dpr=window.devicePixelRatio||1,css=270;
  canvas.width=css*dpr;canvas.height=css*dpr;canvas.style.width=css+'px';canvas.style.height=css+'px';
  var ctx=canvas.getContext('2d');ctx.setTransform(dpr,0,0,dpr,0,0);
  var w=css,h=css,cx=w/2,cy=h/2,r=94,n=labels.length,step=(Math.PI*2)/n;
  ctx.clearRect(0,0,w,h);
  ctx.fillStyle='#fffdf9';ctx.beginPath();ctx.arc(cx,cy,r+28,0,Math.PI*2);ctx.fill();
  for(var i=1;i<=4;i++){var gr=r/4*i;ctx.beginPath();
    for(var j=0;j<=n;j++){var a=step*j-Math.PI/2,x2=cx+gr*Math.cos(a),y2=cy+gr*Math.sin(a);j===0?ctx.moveTo(x2,y2):ctx.lineTo(x2,y2);}
    ctx.closePath();ctx.strokeStyle=i===4?'rgba(63,81,88,.22)':'rgba(63,81,88,.11)';ctx.lineWidth=i===4?1.25:1;ctx.stroke();}
  for(var i2=0;i2<n;i2++){var a2=step*i2-Math.PI/2;ctx.beginPath();ctx.moveTo(cx,cy);
    ctx.lineTo(cx+r*Math.cos(a2),cy+r*Math.sin(a2));ctx.strokeStyle='rgba(63,81,88,.11)';ctx.lineWidth=1;ctx.stroke();}
  ctx.beginPath();
  for(var i3=0;i3<n;i3++){var a3=step*i3-Math.PI/2,sc=scores[i3]/100,x3=cx+r*sc*Math.cos(a3),y3=cy+r*sc*Math.sin(a3);i3===0?ctx.moveTo(x3,y3):ctx.lineTo(x3,y3);}
  ctx.closePath();
  var rr=parseInt(color.slice(1,3),16),gg=parseInt(color.slice(3,5),16),bb=parseInt(color.slice(5,7),16);
  var grad=ctx.createRadialGradient(cx,cy,18,cx,cy,r);grad.addColorStop(0,'rgba('+rr+','+gg+','+bb+',.28)');grad.addColorStop(1,'rgba('+rr+','+gg+','+bb+',.10)');
  ctx.fillStyle=grad;ctx.fill();
  ctx.strokeStyle='rgba('+rr+','+gg+','+bb+',.88)';ctx.lineWidth=2;ctx.stroke();
  for(var i4=0;i4<n;i4++){var a4=step*i4-Math.PI/2,sc2=scores[i4]/100,x4=cx+r*sc2*Math.cos(a4),y4=cy+r*sc2*Math.sin(a4);
    ctx.beginPath();ctx.arc(x4,y4,5,0,Math.PI*2);ctx.fillStyle='#fffdf9';ctx.fill();ctx.lineWidth=2.5;ctx.strokeStyle=color;ctx.stroke();}
  ctx.fillStyle='#26312f';ctx.font='800 11px "Microsoft YaHei",sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
  for(var i5=0;i5<n;i5++){var a5=step*i5-Math.PI/2,lx=cx+(r+30)*Math.cos(a5),ly=cy+(r+30)*Math.sin(a5);ctx.fillText(labels[i5],lx,ly);}
}

// ====== MODAL ======
function openModal(x,triggerEl){
  if(!x)return;
  state.activeModalId=x.id;
  state.lastFocusedElement=triggerEl||document.activeElement;
  var pre=radarPresets[x.c]||radarPresets.airforce,rid='radarC';
  var sr=Object.keys(x.sp).map(function(k){return'<div class="spec-item"><span class="spec-label">'+escapeHtml(k)+'</span><span class="spec-value">'+escapeHtml(x.sp[k])+'</span></div>'}).join('');
  var ri=x.rd.map(function(s,i){return'<div class="radar-row"><div class="dot" style="background:'+pre.color+'"></div><span class="lbl">'+escapeHtml(pre.labels[i])+'</span><div class="bar-wrap"><div class="bar-fill" style="width:'+s+'%;background:'+pre.color+'"></div></div><span class="val">'+s+'</span></div>'}).join('');
  var dh=x.ds.map(function(p,i){var t=['概述','技术特点','战略意义'];return'<h4>'+(t[i]||'补充信息')+'</h4><p>'+escapeHtml(p)+'</p>'}).join('');
  var sc=x.s==='active'?'tag-active':'tag-test',st=x.s==='active'?'● 现役':'◎ 测试中';
  var cm=catMeta[x.c]||{name:x.c,icon:''};
  mCont.innerHTML=buildMediaGallery(x)+
    '<div class="modal-body">'+
    '<div class="modal-tags"><span class="modal-tag">'+cm.icon+' '+escapeHtml(cm.name)+'</span><span class="modal-status '+sc+'">'+st+'</span><button class="source-open-btn" type="button" data-source-toggle>数据来源</button></div>'+
    '<h2 id="modalTitle">'+escapeHtml(x.n)+'</h2><div class="model-name">'+escapeHtml(x.fn)+'</div>'+buildSourcePanel(x)+
    '<div class="specs-grid">'+sr+'</div>'+
    '<div class="radar-block"><div class="radar-canvas-wrap"><canvas id="'+rid+'" width="250" height="250" aria-label="'+escapeHtml(x.n)+'五维能力雷达图"></canvas></div><div class="radar-info"><h4>五维能力观察</h4><div class="radar-note">基于公开报道要点转译为专题阅读指标，具体来源可点“数据来源”核对。</div>'+ri+'</div></div>'+
    '<div class="desc-block">'+dh+'</div></div>';
  mOver.classList.add('show');
  mOver.setAttribute('aria-hidden','false');
  document.body.classList.add('modal-open');
  document.body.style.overflow='hidden';
  mCont.parentElement.scrollTop=0;
  setTimeout(function(){var c=document.getElementById(rid);if(c)drawRadar(c,pre.labels,x.rd,pre.color);if(mClose)mClose.focus()},160);
}
function closeModal(){
  pauseModalVideo();
  if(!mOver.classList.contains('show'))return;
  mOver.classList.remove('show');
  mOver.setAttribute('aria-hidden','true');
  document.body.classList.remove('modal-open');
  document.body.style.overflow='';
  state.activeModalId=null;
  var last=state.lastFocusedElement;
  setTimeout(function(){if(last&&document.body.contains(last))last.focus()},180);
}

// ====== INTERACTIONS ======
function updateActiveNav(){
  var links=tNav.querySelectorAll('.nav-link');
  for(var i=0;i<links.length;i++){
    var active=links[i].dataset.cat===state.category;
    links[i].classList.toggle('active',active);
    if(active)links[i].setAttribute('aria-current','page');else links[i].removeAttribute('aria-current');
  }
}
function scheduleRender(){clearTimeout(searchTimer);searchTimer=setTimeout(function(){render(filterItems())},90)}
function closeMenu(){document.body.classList.remove('menu-open');if(mBtn){mBtn.setAttribute('aria-expanded','false');mBtn.setAttribute('aria-label','打开分类菜单')}}
function toggleMenu(){var open=document.body.classList.toggle('menu-open');mBtn.setAttribute('aria-expanded',open?'true':'false');mBtn.setAttribute('aria-label',open?'关闭分类菜单':'打开分类菜单')}
function openItemFromCard(el){
  if(!el)return;
  var item=findItemById(el.dataset.id);
  if(!item)return;
  el.classList.add('is-pressed');
  setTimeout(function(){el.classList.remove('is-pressed');openModal(item,el)},120);
}
function bindEvents(){
  grid.addEventListener('click',function(e){var c=safeClosest(e.target,'.card[data-id]');if(c&&grid.contains(c)){e.preventDefault();openItemFromCard(c)}});
  grid.addEventListener('keydown',function(e){if(e.key!=='Enter'&&e.key!==' ')return;var c=safeClosest(e.target,'.card[data-id]');if(c&&grid.contains(c)){e.preventDefault();openItemFromCard(c)}});
  tNav.addEventListener('click',function(e){var b=safeClosest(e.target,'.nav-link');if(!b)return;e.preventDefault();if(b.dataset.page){window.location.href=b.dataset.page;return}state.category=b.dataset.cat||'all';updateActiveNav();closeMenu();closeModal();render(filterItems())});
  sIn.addEventListener('input',function(){state.query=sIn.value.trim();scheduleRender()});
  clearSearch.addEventListener('click',function(){sIn.value='';state.query='';render(filterItems());sIn.focus()});
  mClose.addEventListener('click',closeModal);
  mOver.addEventListener('click',function(e){if(e.target===mOver)closeModal()});
  mCont.addEventListener('click',function(e){
    var sourceToggle=safeClosest(e.target,'[data-source-toggle]');
    if(sourceToggle&&mCont.contains(sourceToggle)){var panel=document.getElementById('sourcePanel');if(panel){panel.hidden=!panel.hidden;if(!panel.hidden)panel.scrollIntoView({block:'nearest',behavior:'smooth'});}return;}
    var sourceClose=safeClosest(e.target,'[data-source-close]');
    if(sourceClose&&mCont.contains(sourceClose)){var p=document.getElementById('sourcePanel');if(p)p.hidden=true;return;}
    var b=safeClosest(e.target,'[data-media-type]');if(!b||!mCont.contains(b))return;switchModalMedia(b.dataset.mediaType,parseInt(b.dataset.mediaIndex||'0',10))
  });
  mBtn.addEventListener('click',function(e){e.stopPropagation();toggleMenu()});
  document.addEventListener('click',function(e){if(!safeClosest(e.target,'#topbar')&&document.body.classList.contains('menu-open'))closeMenu()});
  document.addEventListener('keydown',function(e){if(e.key==='Escape'){if(mOver.classList.contains('show'))closeModal();else if(document.body.classList.contains('menu-open'))closeMenu();else if(state.query){sIn.value='';state.query='';render(filterItems())}}});
  window.addEventListener('scroll',function(){if(window.scrollY>500)btt.classList.add('visible');else btt.classList.remove('visible')});
  btt.addEventListener('click',function(){window.scrollTo({top:0,behavior:'smooth'})});
}

// ====== INIT ======
function init(){updateActiveNav();bindEvents();render(E)}
init();
</script>
