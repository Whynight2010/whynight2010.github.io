<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>一站式国防教育服务平台</title>
<style>
/* ====== 锐卫天演设计系统 ====== */
:root{
  --bg:#f4f3ef;
  --paper:#fffdfa;
  --paper-strong:#ffffff;
  --ink:#111817;
  --ink-soft:#26312f;
  --muted:#68736f;
  --muted-2:#8b9691;
  --line:#ddd8cf;
  --line-soft:#ece7dd;
  --accent:#8f2f22;
  --accent-dark:#5f1f18;
  --accent-soft:#f4e5df;
  --steel:#3f5158;
  --steel-light:#5a7a82;
  --shadow-soft:0 18px 50px rgba(20,28,25,.08);
  --shadow-card:0 22px 56px rgba(20,28,25,.12);
  --shadow-drop:0 20px 48px rgba(20,28,25,.16);
  --radius-lg:24px;
  --radius-md:16px;
  --radius-sm:10px;
  --topbar-height:64px;
  --topbar-floating-offset:18px;
  --topbar-floating-radius:999px;
  --topbar-floating-width:clamp(360px,33vw,600px);
  --motion-fast:180ms cubic-bezier(.2,.8,.2,1);
  --motion-smooth:520ms cubic-bezier(.2,.8,.2,1);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:16px}
body{font-family:"Microsoft YaHei","PingFang SC","Noto Sans SC",system-ui,sans-serif;background:radial-gradient(circle at top left,rgba(143,47,34,.08),transparent 30rem),var(--bg);color:var(--ink);line-height:1.75;-webkit-font-smoothing:antialiased;overflow:hidden;height:100vh;height:100dvh;display:flex;flex-direction:column}
body.menu-open{overflow:hidden}
body.modal-open{overflow:hidden}
button,input{font:inherit}
button{cursor:pointer}
a{text-decoration:none;color:inherit}
:focus-visible{outline:3px solid rgba(143,47,34,.32);outline-offset:4px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

/* ====== 顶部栏 ====== */
.topbar{position:fixed;top:var(--topbar-floating-offset);left:50%;transform:translateX(-50%) scale(.965);transform-origin:center top;z-index:50;background:rgba(255,253,250,.18);backdrop-filter:blur(18px);border:1px solid transparent;display:flex;align-items:center;justify-content:center;gap:0;padding:0 18px;min-height:var(--topbar-height);width:min(calc(100% - 36px),720px);border-radius:var(--topbar-floating-radius);box-shadow:0 18px 42px rgba(15,20,24,.16);transition:top var(--motion-smooth),width var(--motion-smooth),padding var(--motion-smooth),border-radius var(--motion-smooth),transform var(--motion-smooth),background-color var(--motion-smooth),box-shadow var(--motion-smooth),border-color var(--motion-smooth),opacity var(--motion-fast);flex-shrink:0}
.topbar.topbar--expanded{top:0;left:50%;transform:translateX(-50%) scale(1);width:100%;border-radius:0;background:rgba(255,253,250,.96);border:1px solid transparent;border-bottom-color:var(--line);box-shadow:0 1px 0 rgba(17,24,23,.02);justify-content:flex-start;padding:0 28px}
.topbar-brand{display:flex;align-items:baseline;gap:10px;color:#fff;white-space:nowrap;letter-spacing:-.03em;transition:color var(--motion-fast)}
.topbar-brand span:first-child{width:10px;height:10px;border-radius:50%;background:#f2bf6b;box-shadow:0 0 0 6px rgba(242,191,107,.16);font-size:0;flex-shrink:0;transition:background-color var(--motion-fast),box-shadow var(--motion-fast)}
.topbar-brand .txt{font-family:"Noto Serif SC","Songti SC","SimSun",serif;font-size:1.05rem;font-weight:800}
.topbar.topbar--expanded .topbar-brand{color:var(--ink)}
.topbar.topbar--expanded .topbar-brand span:first-child{background:var(--accent);box-shadow:0 0 0 6px rgba(143,47,34,.1)}
.topbar-back{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:7px 14px;border:1px solid rgba(242,191,107,.9);border-radius:999px;background:rgba(255,253,250,.18);color:#fff;font-size:.82rem;font-weight:800;backdrop-filter:blur(10px);box-shadow:0 10px 24px rgba(17,24,23,.12);margin-right:12px;transition:background-color var(--motion-fast),color var(--motion-fast),border-color var(--motion-fast),box-shadow var(--motion-fast),opacity var(--motion-fast)}
.topbar-back:hover{background:rgba(255,255,255,.26);box-shadow:0 12px 26px rgba(17,24,23,.14)}
.topbar.topbar--expanded .topbar-back{background:#fff9ef;color:var(--ink);border-color:rgba(242,191,107,.9)}
.topbar-back[hidden]{display:none}

/* Nav — dropdown groups */
.topbar-nav{display:flex;align-items:center;justify-content:center;gap:8px;overflow-x:visible;scrollbar-width:none;flex:0 1 auto;max-width:100%;white-space:nowrap;padding:0;background:transparent}
.topbar.topbar--expanded .topbar-nav{flex:1 1 auto;justify-content:center}
.topbar-nav::-webkit-scrollbar{display:none}
.nav-group-label{font-size:.92rem;font-weight:800;color:rgba(255,255,255,.92);padding:8px 18px;border:1px solid transparent;border-radius:999px;cursor:pointer;white-space:nowrap;letter-spacing:.02em;transition:background-color var(--motion-fast),color var(--motion-fast),border-color var(--motion-fast),box-shadow var(--motion-fast);user-select:none;display:flex;align-items:center;justify-content:center;gap:5px;background:transparent}
.nav-group-label:hover{background:rgba(255,255,255,.14);color:#fff;border-color:rgba(255,255,255,.12)}
.topbar.topbar--expanded .nav-group-label{color:var(--ink)}
.topbar.topbar--expanded .nav-group-label:hover{background:#f0ece4;color:var(--accent-dark);border-color:var(--line-soft)}
.nav-group-label.active,.nav-group-label[aria-current="page"]{background:rgba(255,253,250,.12);color:var(--ink);border-color:rgba(242,191,107,.9);box-shadow:0 10px 24px rgba(17,24,23,.12)}
.nav-link{position:relative;padding:8px 15px;border:1px solid transparent;border-radius:999px;background:transparent;color:rgba(255,255,255,.78);font-size:.84rem;font-weight:650;white-space:nowrap;transition:color var(--motion-fast),background-color var(--motion-fast),border-color var(--motion-fast),box-shadow var(--motion-fast),opacity var(--motion-fast);display:inline-flex}
.nav-link:hover{color:#fff;background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.18);box-shadow:0 10px 22px rgba(17,24,23,.12)}
.nav-link.active,.nav-link[aria-current="page"]{color:#fff;background:rgba(17,24,23,.8);border-color:rgba(255,255,255,.16);box-shadow:0 10px 24px rgba(17,24,23,.18)}
.topbar.topbar--expanded .nav-link{color:var(--muted)}
.topbar.topbar--expanded .nav-link:hover{color:var(--ink);background:#f0ece4;border-color:var(--line-soft)}
.topbar.topbar--expanded .nav-link.active,.topbar.topbar--expanded .nav-link[aria-current="page"]{color:#fff;background:var(--ink);border-color:var(--ink);box-shadow:0 10px 24px rgba(17,24,23,.12)}
.nav-link.sim-link{color:rgba(255,255,255,.86);border-color:rgba(255,255,255,.22)}
.topbar.topbar--expanded .nav-link.sim-link{color:var(--steel);border-color:rgba(63,81,88,.18)}
.nav-link.sim-link:hover{color:var(--accent);background:var(--accent-soft);border-color:rgba(143,47,34,.22)}
.nav-group-divider{width:1px;height:28px;background:var(--line);margin:0 6px;flex-shrink:0}

/* Search — only in browse view */
.browse-search{display:flex;align-items:center;gap:7px;background:#f6f2eb;border:1px solid transparent;border-radius:999px;padding:7px 13px;transition:border-color var(--motion-fast),background-color var(--motion-fast),box-shadow var(--motion-fast);min-width:180px;flex-shrink:0;margin-left:auto}
.browse-search:focus-within{border-color:rgba(143,47,34,.45);background:#fff;box-shadow:0 10px 28px rgba(143,47,34,.08)}
.browse-search input{border:none;outline:none;background:transparent;font-size:.82rem;width:120px;color:var(--ink)}
.browse-search input::placeholder{color:var(--muted-2)}
.browse-search svg{width:15px;height:15px;color:var(--muted-2);flex-shrink:0}
.clear-search{width:22px;height:22px;border:none;border-radius:50%;background:transparent;color:var(--muted-2);display:none;align-items:center;justify-content:center;transition:background-color var(--motion-fast),color var(--motion-fast),transform var(--motion-fast);flex-shrink:0}
.clear-search.visible{display:flex}
.clear-search:hover{background:var(--accent-soft);color:var(--accent);transform:rotate(90deg)}
.topbar-toggle{display:none;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.18);border-radius:999px;width:40px;height:40px;color:#fff;font-size:1.1rem;align-items:center;justify-content:center;transition:box-shadow var(--motion-fast),background-color var(--motion-fast),border-color var(--motion-fast),color var(--motion-fast),opacity var(--motion-fast)}
.topbar.topbar--expanded .topbar-toggle{background:#fff;border-color:var(--line);color:var(--ink)}
.topbar-toggle:hover{box-shadow:0 12px 26px rgba(20,28,25,.1);background:rgba(255,255,255,.2)}

/* ====== 主内容容器 ====== */
.main-content{flex:1;min-height:0;overflow:hidden;position:relative;display:flex;flex-direction:column}
.topbar[hidden]{display:none}

/* ====== 门户视图 ====== */
.portal-view{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;overflow-y:auto;overflow-x:hidden;scroll-behavior:smooth;scroll-snap-type:y mandatory;overscroll-behavior-y:contain}
.portal-view[hidden]{display:none}
.portal-stage,.landing-stage{position:relative;width:100%;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;scroll-snap-align:start;scroll-snap-stop:always}
.portal-hero-stage,.landing-hero-stage{padding:0}
.portal-chooser-stage,.landing-chooser-stage{padding:clamp(28px,4vw,56px) 32px clamp(34px,5vw,64px);background:linear-gradient(180deg,#f8f5ef 0%,#f4f1ea 100%)}

.hero{position:relative;overflow:hidden;background:#16191c;background-size:cover;background-position:center;color:#fff;padding:clamp(112px,15vw,180px) 32px clamp(72px,9vw,112px);text-align:center;width:100%;min-height:100dvh;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.hero::before,.landing-hero-overlay{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(14,18,22,.5) 0%,rgba(14,18,22,.2) 42%,rgba(14,18,22,.78) 100%)}
.hero-content,.landing-hero-body{position:relative;z-index:1;max-width:820px;margin:0 auto;animation:heroIn .55s var(--motion-smooth) both;padding:0 24px;text-align:center}
@keyframes heroIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
.hero-kicker,.landing-hero-kicker{display:inline-flex;align-items:center;gap:10px;font-size:.7rem;letter-spacing:.22em;text-transform:uppercase;color:rgba(255,255,255,.84);margin-bottom:18px;border:1px solid rgba(255,255,255,.24);padding:6px 16px;border-radius:999px;background:rgba(255,255,255,.08);backdrop-filter:blur(10px)}
.hero-kicker::before,.landing-hero-kicker::before{content:"";width:6px;height:6px;border-radius:50%;background:#e06a52;box-shadow:0 0 16px rgba(224,106,82,.8)}
.hero h1,.landing-hero-body h2{font-family:"Noto Serif SC","Songti SC","SimSun",serif;font-size:clamp(2.6rem,6vw,5.2rem);font-weight:900;line-height:1.05;letter-spacing:.02em;margin-bottom:12px;text-shadow:0 2px 42px rgba(0,0,0,.5);color:#fff}
.hero h1 .accent{color:#e06a52}
.hero .portal-subtitle,.landing-hero-body p{font-size:1.06rem;color:rgba(255,255,255,.88);max-width:700px;margin:0 auto;line-height:1.8}
.landing-hero-bg{position:absolute;inset:0;background:#16191c center/cover no-repeat}

/* Portal entry cards */
.portal-section-head,.landing-header{text-align:center;padding:0;width:100%;flex-shrink:0}
.portal-section-head h2,.landing-header h2{font-family:"Noto Serif SC","Songti SC","SimSun",serif;font-size:clamp(1.4rem,3.2vw,2rem);font-weight:900;color:var(--ink);letter-spacing:-.02em;margin-bottom:6px}
.portal-section-head p,.landing-header .landing-sub{font-size:.84rem;color:var(--muted);letter-spacing:.14em;line-height:1.8;max-width:560px;margin:0 auto}
.portal-entries,.landing-grid{display:grid;gap:24px;max-width:1180px;width:100%}
.portal-entries{grid-template-columns:1fr 1fr;padding:26px 0 0}
.portal-entries-three{grid-template-columns:repeat(3,minmax(0,1fr))}
.portal-entry,.landing-card{position:relative;display:flex;flex-direction:column;justify-content:flex-end;text-align:left;padding:20px;border:none;border-radius:var(--radius-lg);background:#16191c;cursor:pointer;overflow:hidden;box-shadow:var(--shadow-soft);transition:transform var(--motion-smooth),box-shadow var(--motion-smooth),filter var(--motion-fast);min-height:240px;animation:cardIn .48s var(--motion-smooth) forwards;animation-delay:var(--delay,0ms)}
.portal-entry{padding:30px;min-height:330px}
.portal-entry-bg,.landing-card-bg{position:absolute;inset:0;background-size:cover;background-position:center;transition:transform .9s var(--motion-smooth),filter .9s var(--motion-smooth);z-index:0}
.portal-entry::after,.landing-card::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(15,20,24,.04) 0%,rgba(15,20,24,.24) 48%,rgba(15,20,24,.82) 100%);z-index:1}
.portal-entry:hover,.landing-card:hover{transform:scale(1.015);box-shadow:var(--shadow-drop);filter:saturate(1.02)}
.portal-entry:hover .portal-entry-bg,.landing-card:hover .landing-card-bg{transform:scale(1.03)}
.portal-entry-body,.landing-card .lc-body{position:relative;z-index:2}
.portal-entry h3,.landing-card h3{font-family:"Noto Serif SC","Songti SC","SimSun",serif;font-size:1.18rem;font-weight:900;color:#fff;margin-bottom:5px;letter-spacing:-.02em;text-shadow:0 2px 14px rgba(0,0,0,.42)}
.portal-entry h3{font-size:1.5rem;margin-bottom:6px;text-shadow:0 2px 18px rgba(0,0,0,.4)}
.portal-entry p,.landing-card .lc-desc{font-size:.88rem;color:rgba(255,255,255,.9);line-height:1.7;margin-bottom:16px;text-shadow:0 1px 10px rgba(0,0,0,.35)}
.portal-entry p{max-width:430px;margin-bottom:18px;text-shadow:0 1px 12px rgba(0,0,0,.35)}
.portal-entry .entry-cta,.landing-card .lc-go{display:inline-flex;align-items:center;gap:5px;font-size:.82rem;font-weight:800;color:#fff;padding:7px 14px;border:1px solid rgba(255,255,255,.55);border-radius:999px;width:max-content;background:rgba(255,255,255,.06);backdrop-filter:blur(5px);transition:gap var(--motion-fast),background-color var(--motion-fast),border-color var(--motion-fast)}
.portal-entry .entry-cta{gap:8px;padding:9px 18px;border-color:rgba(255,255,255,.6);backdrop-filter:blur(6px)}
.portal-entry:hover .entry-cta,.landing-card:hover .lc-go{gap:9px;background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.9)}
.landing-card .lc-badge{position:absolute;top:14px;right:14px;z-index:2;padding:4px 10px;border-radius:999px;font-size:.68rem;font-weight:800;background:rgba(17,24,23,.6);color:#fff;backdrop-filter:blur(6px)}
.landing-grid.cols-4{grid-template-columns:repeat(4,1fr)}
.landing-grid.cols-3{grid-template-columns:repeat(3,1fr)}
.landing-grid.cols-2{grid-template-columns:repeat(2,1fr)}
.landing-back-row{width:100%;max-width:1180px;padding:0 0 18px;flex-shrink:0}
.landing-back{display:inline-flex;align-items:center;gap:5px;padding:7px 15px;border:1px solid var(--line);border-radius:999px;background:var(--paper);color:var(--ink);font-size:.84rem;font-weight:650;cursor:pointer;white-space:nowrap;transition:all var(--motion-fast)}
.landing-back:hover{background:var(--ink);color:#fff;border-color:var(--ink);transform:translateX(-2px)}
.landing-card.accent-air{--accent-lc:#3a7bd5}.landing-card.accent-air::before{background:linear-gradient(90deg,transparent,#3a7bd5,transparent)}
.landing-card.accent-navy{--accent-lc:#1a6b8a}.landing-card.accent-navy::before{background:linear-gradient(90deg,transparent,#1a6b8a,transparent)}
.landing-card.accent-army{--accent-lc:#3d7a3d}.landing-card.accent-army::before{background:linear-gradient(90deg,transparent,#3d7a3d,transparent)}
.landing-card.accent-sim{--accent-lc:var(--steel)}.landing-card.accent-sim::before{background:linear-gradient(90deg,transparent,var(--steel),transparent)}

/* ====== 二级目录落地页 ====== */
.landing-view{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;overflow-y:auto;overflow-x:hidden;scroll-behavior:smooth;scroll-snap-type:y mandatory;overscroll-behavior-y:contain;animation:fadeIn .3s var(--motion-smooth) both}
.landing-view[hidden]{display:none}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

/* ====== 通用内容视图 ====== */
.content-view{flex:1;display:flex;flex-direction:column;overflow:hidden;animation:fadeIn .3s var(--motion-smooth) both}
.content-view[hidden]{display:none}
.content-shell{width:100%;max-width:1060px;margin:0 auto;padding:12px 32px 36px;overflow:auto}
.content-header{margin-bottom:18px}
.content-eyebrow{display:inline-flex;align-items:center;gap:8px;padding:4px 12px;border-radius:999px;background:var(--accent-soft);color:var(--accent-dark);font-size:.72rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;margin-bottom:10px}
.content-header h2{font-family:"Noto Serif SC","Songti SC","SimSun",serif;font-size:clamp(1.5rem,4vw,2.2rem);font-weight:900;color:var(--ink);margin-bottom:6px;letter-spacing:-.02em}
.content-header p{font-size:.92rem;color:var(--muted);line-height:1.8;max-width:760px}
.content-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.content-card,.quiz-question,.link-item,.content-note{background:var(--paper);border:1px solid var(--line-soft);border-radius:var(--radius-lg);box-shadow:0 1px 0 rgba(17,24,23,.02)}
.content-card{padding:22px 20px}
.content-card h3{font-family:"Noto Serif SC","Songti SC","SimSun",serif;font-size:1.08rem;font-weight:900;color:var(--ink);margin-bottom:8px}
.content-card p{font-size:.88rem;color:var(--muted);line-height:1.8}
.content-note{margin-top:18px;padding:18px 20px;font-size:.85rem;color:var(--muted);line-height:1.8;background:linear-gradient(135deg,#fffaf6 0%,#fffdfa 100%)}
.link-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.link-item{display:block;padding:18px 18px 16px;transition:transform var(--motion-fast),box-shadow var(--motion-fast),border-color var(--motion-fast)}
.link-item:hover{transform:translateY(-3px);box-shadow:var(--shadow-card);border-color:#d5ccc0}
.link-item strong{display:block;font-family:"Noto Serif SC","Songti SC","SimSun",serif;font-size:1rem;color:var(--ink);margin-bottom:6px}
.link-item p{font-size:.84rem;color:var(--muted);line-height:1.75;margin-bottom:10px}
.link-item span{font-size:.78rem;font-weight:800;color:var(--accent)}
.quiz-shell{display:grid;gap:16px}
.quiz-summary{padding:14px 18px;border-radius:999px;background:var(--accent-soft);color:var(--accent-dark);font-size:.86rem;font-weight:800;display:inline-flex;justify-self:flex-start}
.quiz-question{padding:20px}
.quiz-q-title{display:inline-flex;padding:4px 10px;border-radius:999px;background:#f3eee6;color:var(--muted);font-size:.72rem;font-weight:800;margin-bottom:10px}
.quiz-question h3{font-size:1rem;color:var(--ink);line-height:1.7;margin-bottom:14px}
.quiz-options{display:grid;gap:10px}
.quiz-option{padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:#fffdfa;color:var(--ink-soft);text-align:left;transition:transform var(--motion-fast),border-color var(--motion-fast),background-color var(--motion-fast)}
.quiz-option:hover{transform:translateY(-1px);border-color:rgba(143,47,34,.35);background:#fff8f4}
.quiz-option:disabled{cursor:default;opacity:1}
.quiz-option.is-correct{background:#ecf6ee;border-color:#9dc8aa;color:#28553a}
.quiz-option.is-wrong{background:#fbeceb;border-color:#e0aaa1;color:#8f2f22}
.quiz-feedback{margin-top:12px;padding:12px 14px;border-radius:14px;background:#f7f2eb;color:var(--muted);font-size:.84rem;line-height:1.75}
.quiz-feedback strong{color:var(--ink)}

/* ====== 装备浏览视图 ====== */
.browse-view{flex:1;display:flex;flex-direction:column;overflow:hidden}
.browse-view[hidden]{display:none}
.browse-topbar{display:flex;align-items:center;gap:14px;padding:12px 28px;border-bottom:1px solid var(--line-soft);background:rgba(255,253,250,.8);flex-shrink:0;flex-wrap:wrap}
.browse-back{display:inline-flex;align-items:center;gap:5px;padding:7px 15px;border:1px solid var(--line);border-radius:999px;background:var(--paper);color:var(--ink);font-size:.84rem;font-weight:650;cursor:pointer;white-space:nowrap;transition:all var(--motion-fast)}
.browse-back:hover{background:var(--ink);color:#fff;border-color:var(--ink);transform:translateX(-2px)}
.browse-title{font-family:"Noto Serif SC","Songti SC","SimSun",serif;font-size:1.15rem;font-weight:800;color:var(--ink);flex:1}
.browse-filters{display:flex;gap:4px;flex-wrap:wrap}
.browse-filters .nav-link{font-size:.8rem;padding:6px 13px}

.results-bar{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:10px 28px;flex-shrink:0}
.results-title{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.results-title strong{font-family:"Noto Serif SC","Songti SC","SimSun",serif;font-size:1rem;color:var(--ink)}

  {"id":"j20","c":"airforce","n":"歼-20","fn":"歼-20 \"威龙\" 隐身战斗机","rd":[98,92,98,95,88],"sp":{"类型":"第五代单座双发隐身战斗机","制造商":"成都飞机工业集团","首飞":"2011.1.11","服役":"2017年","产量":"200+架(2025)","长度":"21.2m","最大速度":"2.5马赫","作战半径":"2000+km","发动机":"涡扇-15(国产)","武器":"PL-10/12/15空空导弹","单价":"约7亿人民币"},"ds":["歼-20“威龙”是我国自主研制的第五代隐身战斗机，采用鸭式气动布局与DSI进气道、全动V型尾翼，兼具高隐身、超音速巡航与高态势感知能力，是中国空军的“国之利刃”。","2011年1月11日歼-20成功首飞，此后历经多年试飞完善；2017年正式列装空军作战部队，标志着我国成为第二个装备第五代隐身战斗机的国家。","换装国产涡扇-15发动机后，歼-20A具备了超音速巡航能力，动力与机动性大幅提升，航电与传感器融合水平也达到世界先进水准。","2025年阅兵中歼-20、歼-20A、歼-20S三型同场亮相，双座型歼-20S可充当无人僚机指挥平台，引导攻击-11等无人机群协同作战。","歼-20与歼-16、攻击-11组成“新三剑客”有人/无人编队，实现夺取制空权、猎杀敌预警机与加油机等高价值目标的战术运用。","目前歼-20现役规模已突破200架，年产量稳步提升，是维护国家空天安全、支撑战略空军转型的核心作战力量。"],"s":"active"},
  {"id":"y20","c":"airforce","n":"运-20","fn":"运-20 \"鲲鹏\" 战略运输机","rd":[96,92,90,88,86],"radarConfig":{"labels":["战略投送","装载能力","航程续航","体系支援","任务适配"],"color":"#8f2f22"},"sp":{"类型":"大型战略运输机","制造商":"西安飞机工业集团","服役":"2016年","最大起飞重量":"220吨","最大载重":"66吨","最大航程":"7800km(涡扇-20)","货舱":"20×4×4m","改型":"运油-20、空警-3000平台"},"ds":["运-20“鲲鹏”是我国自主研制的大型运输机，货舱可装载99A主战坦克与直升机，结束了“大装备运不了、远距离投不动”的历史。","运-20最大起飞重量约220吨、最大载重66吨，机舱宽大，可执行人员、装备与物资的远距离战略投送任务。","最新型运-20B换装国产涡扇-20发动机，航程突破近万公里，具备跨洲际战略投送能力，摆脱了对进口发动机的依赖。","运油-20空中加油改型解决了歼-20等战机远程作战的航程瓶颈，显著拓展了空军远海远域作战半径。","运-20多次参与海外撤侨与国际人道主义救援，向多国运送防疫物资，展现大国担当，成为空军战略投送的中坚。","截至近年运-20装备数量持续增长，与运油-20、预警机改型共同构成我国远程战略投送与支援保障体系的核心。"],"s":"active"},
  {"id":"fujian","c":"navy","n":"福建舰","fn":"003型航空母舰 \"福建舰\"","rd":[95,88,72,92,90],"sp":{"类型":"大型航空母舰(电磁弹射)","排水量":"约8万吨","长度":"约316m","入列":"2025.11.5","弹射":"电磁弹射×3","舰载机":"歼-35/歼-15T/空警-600/直-20","动力":"常规动力(综合电力)","造价":"约500亿人民币","母港":"海南三亚"},"ds":["福建舰是我国首艘电磁弹射型航空母舰，舷号18，满载排水量8万余吨，采用平直通长飞行甲板，是我国完全自主设计建造的国之重器。","福建舰配置电磁弹射和阻拦装置，是全球首艘常规动力加电磁弹射的航母，弹射加速更平稳、能量利用率更高，可适配不同机型。","2025年11月5日，福建舰在海南三亚交接入列并正式命名授旗，标志着人民海军进入“三航母时代”。","电磁弹射使福建舰可弹射歼-35、歼-15T、空警-600预警机、直-20及攻击-11无人机等全系列机型，作战效能远超滑跃起飞航母。","入列后福建舰持续进行高强度舰机适配试验，开展多航母编队协同演练，加速向“完全形成战斗力”迈进。","作为我国最新型航空母舰，福建舰大幅提升海军远海作战与体系对抗能力，是建设世界一流海军的标志性装备。"],"s":"active"},
  {"id":"shandong","c":"navy","n":"山东舰","fn":"002型航空母舰 \"山东舰\"","rd":[82,80,65,78,82],"sp":{"类型":"中型航母(滑跃)","排水量":"约6-7万吨","入列":"2019.12.17","舰载机":"歼-15(约36架)","母港":"三亚","特点":"中国首艘国产航母"},"ds":["山东舰是我国首艘自主设计建造的航空母舰，舷号17，2019年12月17日交付海军入列，实现了从引进改装到自主建造的跨越。","山东舰在辽宁舰基础上优化，缩小舰岛、扩大甲板与机库面积，满载排水量约5.5万吨，采用滑跃式飞行甲板。","山东舰可搭载约36架歼-15舰载机，入列后迅速形成体系作战能力，是中国海军重要的海上力量平台。","近年来山东舰多次率编队参与南海、台海等方向实战化训练与远海训练，检验了航母编队作战能力。","2024年，山东舰与辽宁舰完成首次双航母编队演练，展示了我国多航母协同作战能力取得重要进展。","作为首艘国产航母，山东舰锻炼培养了我国航母建造、管理与作战人才，为后续航母发展奠定坚实基础。"],"s":"active"},

  {"id":"type99a","c":"army","n":"99A式主战坦克","fn":"99A式 主战坦克","rd":[96,95,78,90,85],"sp":{"类型":"第三代信息化主战坦克","战斗全重":"约58吨","乘员":"3人","主炮":"125mm滑膛炮(自动装填)","发动机":"1500马力","最大速度":"80km/h","装甲":"复合装甲+FY-5爆反","特点":"激光压制观瞄系统"},"ds":["99A式是我国首型信息化主战坦克，被誉为“陆战之王”，2015年九三阅兵首次公开亮相，是陆军地面突击的核心力量。","99A装备125毫米滑膛炮，发射穿甲弹可在2000米距离穿透厚装甲，火力处于世界先进水平。","99A采用复合装甲与爆炸反应装甲，正面防护能力突出，并配备激光自卫系统可干扰敌方观瞄设备。","99A换装1500马力大功率发动机，机动性能大幅提升，具备良好的越野与突击能力。","99A装备数字战场管理系统，通过数据链与无人机、友邻坦克实时共享态势，实现协同攻防。","99A已大规模装备重型合成旅，显著提升陆军装甲部队的突击与信息化作战能力。"],"s":"active"},
  {"id":"hq17a","c":"army","n":"红旗-17A","fn":"红旗-17A 野战防空导弹系统","rd":[84,89,80,86,90],"sp":{"类型":"野战防空导弹系统","底盘":"履带式机动底盘","服役":"2019年后","任务":"低空/超低空防空","特点":"机动部署、反应迅速、伴随保障","用途":"陆军野战防空"},"ds":["红旗-17A是陆军野战防空体系的重要装备，主要用于伴随地面部队对抗低空、超低空空中威胁。","该系统强调机动部署和快速展开，适合在复杂地形与战术机动环境中提供区域防空掩护。","红旗-17A可对飞机、巡航导弹、空地导弹等目标实施拦截，是野战防空阵地的重要支点。","与雷达车、发射车和指挥保障力量协同后，红旗-17A能够形成较完整的机动作战防空链路。","陆军合成作战中，红旗-17A常与地面突击和纵深机动部队配套使用，提升纵深生存能力。","作为新一代陆军防空装备，它直观体现了陆军从单一火力防护向体系防护转变的趋势。"],"s":"active"},

t();openItemFromCard(c)}});grid.addEventListener('keydown',function(e){if(e.key!=='Enter'&&e.key!==' ')return;var c=safeClosest(e.target,'.card[data-id]');if(c&&grid.contains(c)){e.preventDefault();openItemFromCard(c)}});tNav.addEventListener('click',function(e){var label=safeClosest(e.target,'.nav-group-label');if(!label)return;e.preventDefault();if(label.dataset.landing){showLanding(label.dataset.landing);closeMenu()}});tNav.addEventListener('keydown',function(e){var label=safeClosest(e.target,'.nav-group-label');if(!label)return;if(e.key!=='Enter'&&e.key!==' ')return;e.preventDefault();if(label.dataset.landing){showLanding(label.dataset.landing);closeMenu()}});var bf=document.getElementById('browseFilters');bf.addEventListener('click',function(e){var b=safeClosest(e.target,'.nav-link');if(!b)return;e.preventDefault();if(b.dataset.cat)setCategory(b.dataset.cat)});sIn.addEventListener('input',function(){state.query=sIn.value.trim();if(state.query&&(state.currentView==='portal'||state.currentView==='landing'||state.currentView==='content'))showBrowse(state.category);scheduleRender()});clearSearch.addEventListener('click',function(){sIn.value='';state.query='';render(filterItems());sIn.focus()});contentBody.addEventListener('click',function(e){var province=safeClosest(e.target,'.province-btn');if(province&&contentBody.contains(province)){e.preventDefault();updateBaseProvince(province.dataset.province);return}var option=safeClosest(e.target,'.quiz-option');if(option&&contentBody.contains(option)){var qi=parseInt(option.dataset.quizIndex,10),choice=parseInt(option.dataset.quizChoice,10);if(quizState.answered[qi]!==undefined)return;quizState.answered[qi]=choice;var data=quizBank[qi],correct=choice===data.answer;if(correct)quizState.correct+=1;var wrap=contentBody.querySelector('[data-quiz-card="'+qi+'"]');if(wrap){var buttons=wrap.querySelectorAll('.quiz-option');for(var i=0;i<buttons.length;i++){buttons[i].disabled=true;if(parseInt(buttons[i].dataset.quizChoice,10)===data.answer)buttons[i].classList.add('is-correct');if(buttons[i]===option&&!correct)buttons[i].classList.add('is-wrong')}}var feedback=document.getElementById('quiz-feedback-'+qi);if(feedback){feedback.hidden=false;feedback.innerHTML='<strong>'+(correct?'回答正确':'回答错误')+'：</strong>'+escapeHtml(data.explain)}updateQuizSummary();return}});mClose.addEventListener('click',closeModal);mOver.addEventListener('click',function(e){if(e.target===mOver)closeModal()});mCont.addEventListener('click',function(e){var sourceToggle=safeClosest(e.target,'[data-source-toggle]');if(sourceToggle&&mCont.contains(sourceToggle)){var panel=document.getElementById('sourcePanel');if(panel){panel.hidden=!panel.hidden;if(!panel.hidden)panel.scrollIntoView({block:'nearest',behavior:'smooth'})}return}var sourceClose=safeClosest(e.target,'[data-source-close]');if(sourceClose&&mCont.contains(sourceClose)){var p=document.getElementById('sourcePanel');if(p)p.hidden=true;return}var b=safeClosest(e.target,'[data-media-type]');if(!b||!mCont.contains(b))return;switchModalMedia(b.dataset.mediaType,parseInt(b.dataset.mediaIndex||'0',10))});mBtn.addEventListener('click',function(e){e.stopPropagation();toggleMenu()});document.addEventListener('click',function(e){if(!safeClosest(e.target,'#topbar')&&document.body.classList.contains('menu-open'))closeMenu()});document.addEventListener('keydown',function(e){if(e.key==='Escape'){if(mOver.classList.contains('show'))closeModal();else if(document.body.classList.contains('menu-open'))closeMenu();else if(state.currentView==='landing')showPortal();else if(state.currentView==='browse')showLanding(state.section||'read');else if(state.currentView==='content'&&state.sectionHint)showLanding(state.sectionHint);else if(state.query){sIn.value='';state.query='';render(filterItems())}}})}

// ====== INIT ======
function init(){if(window.location.hash==='#grow')showLanding('grow');else showPortal();updateAllFilters();bindEvents();syncTopbarChrome(state.currentView==='portal'?'floating':'expanded');render(E)}
init();
// ====== HELPERS ======
function normalizeText(value){return String(value||'').toLowerCase().replace(/\s+/g,'').trim()}
function flattenSearchText(value){
  if(Array.isArray(value))return value.map(flattenSearchText).join(' ');
  if(value&&typeof value==='object')return Object.keys(value).map(function(k){return k+' '+flattenSearchText(value[k])}).join(' ');
  return value==null?'':String(value);
}
function getSearchText(x){
  var m=catMeta[x.c]||{name:x.c,icon:''};
  return flattenSearchText([x.n,x.fn,x.c,m.name,x.sp,x.ds]);
}
function findItemById(id){for(var i=0;i<E.length;i++){if(E[i].id===id)return E[i]}return null}
function currentCatName(){return state.category==='all'?'全部':((catMeta[state.category]&&catMeta[state.category].name)||state.category)}
function safeClosest(el,selector){while(el&&el.nodeType===1){if(el.matches&&el.matches(selector))return el;el=el.parentElement}return null}
function escapeHtml(value){return String(value==null?'':value).replace(/[&<>"']/g,function(ch){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]})}
function getSources(x){return sourceCatalog[x.id]||[]}
function buildSourcePanel(x){
  var sources=getSources(x);
  if(!sources.length)return '';
  var links=sources.map(function(s){return '<a class="source-link" href="'+escapeHtml(s.url)+'" target="_blank" rel="noopener noreferrer"><strong>'+escapeHtml(s.name)+'</strong><em>打开来源 ↗</em><span>'+escapeHtml(s.note||'公开资料来源')+'</span></a>'}).join('');
  return '<section class="source-panel" id="sourcePanel" hidden><div class="source-panel-head"><div><h4>公开数据来源</h4><p>以下链接用于核对装备参数、入列节点与公开报道表述。五维评分为基于公开信息的专题化展示，并非官方战术评估。</p></div><button class="source-panel-close" type="button" data-source-close aria-label="关闭来源列表">×</button></div><div class="source-list">'+links+'</div></section>';
}

var IMAGE_PLACEHOLDER='assets/shared/placeholders/image-placeholder.svg';
var VIDEO_PLACEHOLDER='assets/shared/placeholders/video-placeholder.svg';
function getMedia(id){return window.EQUIPMENT_MEDIA&&window.EQUIPMENT_MEDIA[id]?window.EQUIPMENT_MEDIA[id]:null}
function normalizeMediaStatus(status){return status==='ready'?'verified':(status==='placeholder'?'fallback':status)}
function fallbackImage(x,index){return {src:IMAGE_PLACEHOLDER,alt:x.n+' 图片槽位 '+(index+1)+'（暂无官方公开图片）',caption:'图片 '+(index+1)+' · 暂无官方公开素材',sourceName:'本地占位',sourceUrl:'',status:'fallback',slot:index+1}}
function getMediaImages(x){var media=getMedia(x.id),imgs=media&&Array.isArray(media.images)?media.images.slice(0,7):[];for(var i=imgs.length;i<7;i++)imgs.push(fallbackImage(x,i));return imgs.map(function(img,i){return Object.assign(fallbackImage(x,i),img||{})})}
function getMediaVideo(x){var media=getMedia(x.id),v=media&&media.video?media.video:{};return Object.assign({src:'',poster:VIDEO_PLACEHOLDER,title:x.n+' 官方公开视频槽位',sourceName:'本地占位',sourceUrl:'',status:'fallback',note:'暂无官方公开视频素材'},v)}
function realImageCount(x){return getMediaImages(x).filter(function(img){var s=normalizeMediaStatus(img.status);return s!=='fallback'&&s!=='missing'}).length}
function hasRealVideo(x){var v=getMediaVideo(x),s=normalizeMediaStatus(v.status);return !!(v.src&&s!=='fallback'&&s!=='missing')}
function hasWebVideo(x){var v=getMediaVideo(x),s=normalizeMediaStatus(v.status);return !!(!v.src&&s==='web_only'&&v.sourceUrl)}
function mediaBadgeText(x){return realImageCount(x)+' / 7 图 · '+(hasRealVideo(x)?'1 视频':(hasWebVideo(x)?'网页视频':'暂无视频'))}
function imgTag(img,cls){return '<img class="'+(cls||'media-img')+'" src="'+escapeHtml(img.src||IMAGE_PLACEHOLDER)+'" alt="'+escapeHtml(img.alt||img.caption||'装备图片')+'" loading="lazy" decoding="async" onerror="this.onerror=null;this.src=\''+IMAGE_PLACEHOLDER+'\';">'}
function mediaSourceHtml(item,type){
  var statusMap={verified:'已审核官方/央媒素材',ready:'已下载公开来源素材',web_only:'公开网页可观看，未下载本地视频',generated:'本地生成兜底素材',needs_review:'素材待复核',rejected:'来源不符合规则，未入库',fallback:'暂无官方公开素材，当前显示本地占位',placeholder:'暂无官方公开素材，当前显示本地占位',missing:'暂无官方公开素材，当前显示本地占位'};
  return '<span>'+escapeHtml(type)+' · '+escapeHtml(item.sourceName||(item.status==='web_only'?'公开视频网页':'本地占位'))+' · '+(statusMap[item.status]||statusMap.fallback)+'</span>'+(item.sourceUrl?'<a href="'+escapeHtml(item.sourceUrl)+'" target="_blank" rel="noopener noreferrer">查看来源</a>':'');
}
function buildImageStage(img,x,index){return '<figure class="media-figure">'+imgTag(img,'media-img')+'</figure>'}
function buildVideoStage(video,x){
  if(video.src){return '<video controls preload="metadata" poster="'+escapeHtml(video.poster||VIDEO_PLACEHOLDER)+'" title="'+escapeHtml(video.title||x.n+' 视频')+'"><source src="'+escapeHtml(video.src)+'" type="video/mp4">当前浏览器不支持视频播放。</video>'}
  if(video.status==='web_only'&&video.sourceUrl){return '<div class="media-missing web-only"><img src="'+escapeHtml(video.poster||VIDEO_PLACEHOLDER)+'" alt="" aria-hidden="true"><strong>公开视频需联网查看</strong><span>该素材页面可匿名访问，但未找到无需鉴权、无需绕过限制的稳定本地视频文件。</span><a href="'+escapeHtml(video.sourceUrl)+'" target="_blank" rel="noopener noreferrer">打开来源视频网页</a></div>'}
  return '<div class="media-missing"><img src="'+escapeHtml(video.poster||VIDEO_PLACEHOLDER)+'" alt="" aria-hidden="true"><strong>暂无官方公开视频</strong><span>当前装备的视频槽位已保留，待补充官方或央媒公开 720p 短片。</span></div>';
}
function buildMediaGallery(x){
  var imgs=getMediaImages(x),video=getMediaVideo(x),first=imgs[0];
  var thumbs=imgs.map(function(img,i){
    var status=normalizeMediaStatus(img.status),fallback=status==='fallback'||status==='missing';
    return '<button class="media-thumb '+(i===0?'active ':'')+(fallback?'fallback':'')+'" type="button" data-media-type="image" data-media-index="'+i+'" aria-label="查看 '+escapeHtml(x.n)+' 图片 '+(i+1)+'">'+imgTag(img,'thumb-img')+'<span class="thumb-label">图 '+(i+1)+'</span></button>';
  }).join('');
  if(hasRealVideo(x)||hasWebVideo(x)){
    thumbs+='<button class="media-thumb" type="button" data-media-type="video" data-media-index="0" aria-label="查看 '+escapeHtml(x.n)+' 视频">'+imgTag({src:video.poster||VIDEO_PLACEHOLDER,alt:x.n+' 视频封面'},'thumb-img')+'<span class="play-mark">▶</span><span class="thumb-label">视频</span></button>';
  }
  return '<section class="modal-media" data-equipment-id="'+escapeHtml(x.id)+'"><div class="media-stage" id="mediaStage">'+buildImageStage(first,x,0)+'</div><div class="media-thumbs">'+thumbs+'</div><div class="media-source" id="mediaSource">'+mediaSourceHtml(first,'图片 1')+'</div></section>';
}
function pauseModalVideo(){if(!mCont||!mCont.querySelectorAll)return;var videos=mCont.querySelectorAll('video');for(var i=0;i<videos.length;i++)videos[i].pause&&videos[i].pause()}
function switchModalMedia(type,index){
  var item=findItemById(state.activeModalId);if(!item)return;
  var stage=document.getElementById('mediaStage'),source=document.getElementById('mediaSource');if(!stage||!source)return;
  pauseModalVideo();
  var label='',sourceItem=null;
  if(type==='video'){var video=getMediaVideo(item);stage.innerHTML=buildVideoStage(video,item);sourceItem=video;label='视频'}
  else{var imgs=getMediaImages(item);stage.innerHTML=buildImageStage(imgs[index]||imgs[0],item,index);sourceItem=imgs[index]||imgs[0];label='图片 '+(index+1)}
  source.innerHTML=mediaSourceHtml(sourceItem,label);
  var thumbs=mCont.querySelectorAll('.media-thumb');for(var i=0;i<thumbs.length;i++)thumbs[i].classList.remove('active');
  var active=mCont.querySelector('[data-media-type="'+type+'"][data-media-index="'+index+'"]');if(active)active.classList.add('active');
}

// ====== FILTER ======
function filterItems(){
  var q=normalizeText(state.query);
  return E.filter(function(x){
    var matchCat=state.category==='all'||x.c===state.category;
    var matchQ=!q||normalizeText(getSearchText(x)).indexOf(q)>-1;
    return matchCat&&matchQ;
  });
}

// ====== RENDER ======
function render(items){
  items=items||filterItems();
  if(renderTimer)clearTimeout(renderTimer);
  grid.classList.add('is-filtering');
  renderTimer=setTimeout(function(){
    grid.innerHTML='';
    noR.hidden=items.length!==0;
    noR.style.display=items.length?'none':'block';
    if(items.length){
      var grouped={};
      items.forEach(function(x){if(!grouped[x.c])grouped[x.c]=[];grouped[x.c].push(x)});
      if(state.category==='all'&&state.query===''){
        Object.keys(grouped).forEach(function(c){
          var h=document.createElement('div');h.className='cat-heading';h.style.gridColumn='1/-1';
          var m=catMeta[c]||{name:c,icon:''};
          h.innerHTML='<h2>'+escapeHtml(m.name)+'</h2><span class="count">'+grouped[c].length+' 条报道</span>';
          grid.appendChild(h);
          grouped[c].forEach(function(x,i){grid.appendChild(card(x,i))});
        });
      }else{
        items.forEach(function(x,i){grid.appendChild(card(x,i))});
      }
    }
    updateSummary(items.length);
    requestAnimationFrame(function(){grid.classList.remove('is-filtering')});
  },130);
}

function updateSummary(count){
  var q=state.query.trim(),summary='当前显示 '+count+' 条 · '+currentCatName();
  if(q)summary='搜索"'+q+'" · '+currentCatName()+' · '+count+' 条结果';
  if(resultSummary)resultSummary.textContent=summary;
  if(clearSearch)clearSearch.classList.toggle('visible',!!q);
}

function card(x,i){
  var d=document.createElement('article');
  d.className='card';d.setAttribute('role','button');d.setAttribute('tabindex','0');d.setAttribute('data-id',x.id);d.setAttribute('aria-label','查看 '+x.n+' 详情');
  d.style.setProperty('--delay',(i*35)+'ms');
  var m=catMeta[x.c]||{name:x.c,icon:''},primary=getMediaImages(x)[0];
  d.innerHTML='<div class="card-img"><div class="card-cat">'+escapeHtml(m.name)+'</div><div class="card-media-badge">'+mediaBadgeText(x)+'</div>'+imgTag(primary,'media-img')+'</div><div class="card-body"><div class="card-eyebrow">装备档案</div><h3>'+escapeHtml(x.n)+'</h3><div class="model">'+escapeHtml(x.fn)+'</div><div class="excerpt">'+escapeHtml(x.ds[0])+'</div><div class="card-meta"><span>'+escapeHtml(m.name)+' · 离线媒体</span><span>查看详情 →</span></div></div>';
  return d;
}

function articleFigure(img,index){
  return '<figure class="article-fig">'+imgTag(img,'article-img')+'<figcaption>图 '+(index+1)+' · '+escapeHtml(img.sourceName||'公开来源')+'</figcaption></figure>';
}

// ====== RADAR ======
function drawRadar(canvas,labels,scores,color){
  var dpr=window.devicePixelRatio||1,css=250;
  canvas.width=css*dpr;canvas.height=css*dpr;canvas.style.width=css+'px';canvas.style.height=css+'px';
  var ctx=canvas.getContext('2d');ctx.setTransform(dpr,0,0,dpr,0,0);
  var w=css,h=css,cx=w/2,cy=h/2,r=86,n=labels.length,step=(Math.PI*2)/n;
  ctx.clearRect(0,0,w,h);
  ctx.fillStyle='#fffdf9';ctx.beginPath();ctx.arc(cx,cy,r+26,0,Math.PI*2);ctx.fill();
  for(var i=1;i<=4;i++){var gr=r/4*i;ctx.beginPath();
    for(var j=0;j<=n;j++){var a=step*j-Math.PI/2,x2=cx+gr*Math.cos(a),y2=cy+gr*Math.sin(a);j===0?ctx.moveTo(x2,y2):ctx.lineTo(x2,y2);}
    ctx.closePath();ctx.strokeStyle=i===4?'rgba(63,81,88,.22)':'rgba(63,81,88,.11)';ctx.lineWidth=i===4?1.25:1;ctx.stroke();}
  for(var i2=0;i2<n;i2++){var a2=step*i2-Math.PI/2;ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(cx+r*Math.cos(a2),cy+r*Math.sin(a2));ctx.strokeStyle='rgba(63,81,88,.11)';ctx.lineWidth=1;ctx.stroke();}
  ctx.beginPath();
  for(var i3=0;i3<n;i3++){var a3=step*i3-Math.PI/2,sc=scores[i3]/100,x3=cx+r*sc*Math.cos(a3),y3=cy+r*sc*Math.sin(a3);i3===0?ctx.moveTo(x3,y3):ctx.lineTo(x3,y3);}
  ctx.closePath();
  var rr=parseInt(color.slice(1,3),16),gg=parseInt(color.slice(3,5),16),bb=parseInt(color.slice(5,7),16);
  var grad=ctx.createRadialGradient(cx,cy,16,cx,cy,r);grad.addColorStop(0,'rgba('+rr+','+gg+','+bb+',.28)');grad.addColorStop(1,'rgba('+rr+','+gg+','+bb+',.10)');
  ctx.fillStyle=grad;ctx.fill();ctx.strokeStyle='rgba('+rr+','+gg+','+bb+',.88)';ctx.lineWidth=2;ctx.stroke();
  for(var i4=0;i4<n;i4++){var a4=step*i4-Math.PI/2,sc2=scores[i4]/100,x4=cx+r*sc2*Math.cos(a4),y4=cy+r*sc2*Math.sin(a4);
    ctx.beginPath();ctx.arc(x4,y4,4.5,0,Math.PI*2);ctx.fillStyle='#fffdf9';ctx.fill();ctx.lineWidth=2.5;ctx.strokeStyle=color;ctx.stroke();}
  ctx.fillStyle='#26312f';ctx.font='800 10.5px "Microsoft YaHei",sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
  for(var i5=0;i5<n;i5++){var a5=step*i5-Math.PI/2,lx=cx+(r+28)*Math.cos(a5),ly=cy+(r+28)*Math.sin(a5);ctx.fillText(labels[i5],lx,ly);}
}

// ====== MODAL ======
function openModal(x,triggerEl){
  if(!x)return;
  state.activeModalId=x.id;state.lastFocusedElement=triggerEl||document.activeElement;
  var paras=x.ds&&x.ds.length?x.ds:[''];
  var imgs=getMediaImages(x);
  var lead=paras[0]||'';
  var sections='';
  for(var i=1;i<paras.length;i++){
    var img=imgs[i]||imgs[0];
    sections+=articleFigure(img,i)+'<p>'+escapeHtml(paras[i])+'</p>';
  }
  if(!sections&&imgs[1])sections=articleFigure(imgs[1],1);
  var cm=catMeta[x.c]||{name:x.c,icon:''};
  mCont.innerHTML=buildMediaGallery(x)+'<div class="modal-body"><div class="modal-tags"><span class="modal-tag">'+escapeHtml(cm.name)+'</span><span class="modal-status '+(x.s==='active'?'tag-active':'tag-test')+'">'+(x.s==='active'?'● 现役':'◎ 测试中')+'</span><button class="source-open-btn" type="button" data-source-toggle>数据来源</button></div><h2 id="modalTitle">'+escapeHtml(x.n)+'</h2><div class="model-name">'+escapeHtml(x.fn)+'</div>'+buildSourcePanel(x)+'<p class="lead">'+escapeHtml(lead)+'</p><div class="article">'+sections+'</div></div>';
  mOver.classList.add('show');mOver.setAttribute('aria-hidden','false');
  document.body.classList.add('modal-open');
  mCont.parentElement.scrollTop=0;
  setTimeout(function(){if(mClose)mClose.focus()},160);
}
function closeModal(){
  pauseModalVideo();
  if(!mOver.classList.contains('show'))return;
  mOver.classList.remove('show');mOver.setAttribute('aria-hidden','true');
  document.body.classList.remove('modal-open');
  state.activeModalId=null;
  var last=state.lastFocusedElement;
  setTimeout(function(){if(last&&document.body.contains(last))last.focus()},180);
}
