<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>锐卫天演 · 一站式国防装备介绍及战略模拟平台</title>
<style>
/* ====== 锐卫天演设计系统 ====== */
:root{
  --bg:#f4f3ef;
  --paper:#fffdfa;
  --paper-strong:#ffffff;
  --ink:#111817;
  --ink-soft:#26312f;
  --muted:#68736f;
  --muted-2:#8b9691;
  --line:#ddd8cf;
  --line-soft:#ece7dd;
  --accent:#8f2f22;
  --accent-dark:#5f1f18;
  --accent-soft:#f4e5df;
  --steel:#3f5158;
  --steel-light:#5a7a82;
  --shadow-soft:0 18px 50px rgba(20,28,25,.08);
  --shadow-card:0 22px 56px rgba(20,28,25,.12);
  --shadow-drop:0 20px 48px rgba(20,28,25,.16);
  --radius-lg:24px;
  --radius-md:16px;
  --radius-sm:10px;
  --motion-fast:180ms cubic-bezier(.2,.8,.2,1);
  --motion-smooth:380ms cubic-bezier(.2,.8,.2,1);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:16px}
body{font-family:"Microsoft YaHei","PingFang SC","Noto Sans SC",system-ui,sans-serif;background:radial-gradient(circle at top left,rgba(143,47,34,.08),transparent 30rem),var(--bg);color:var(--ink);line-height:1.75;-webkit-font-smoothing:antialiased;overflow:hidden;height:100vh;height:100dvh;display:flex;flex-direction:column}
body.menu-open{overflow:hidden}
body.modal-open{overflow:hidden}
button,input{font:inherit}
button{cursor:pointer}
a{text-decoration:none;color:inherit}
:focus-visible{outline:3px solid rgba(143,47,34,.32);outline-offset:4px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

/* ====== 顶部栏 ====== */
.topbar{position:sticky;top:0;z-index:50;background:rgba(255,253,250,.94);backdrop-filter:blur(18px);border-bottom:1px solid var(--line);display:grid;grid-template-columns:auto 1fr;align-items:center;gap:16px;padding:0 28px;min-height:64px;flex-shrink:0;box-shadow:0 1px 0 rgba(17,24,23,.02)}
.topbar-brand{display:flex;align-items:baseline;gap:10px;color:var(--ink);white-space:nowrap;letter-spacing:-.03em}
.topbar-brand span:first-child{width:10px;height:10px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 6px rgba(143,47,34,.1);font-size:0;flex-shrink:0}
.topbar-brand .txt{font-family:"Noto Serif SC","Songti SC","SimSun",serif;font-size:1.05rem;font-weight:800}

/* Nav — dropdown groups */
.topbar-nav{display:flex;align-items:center;justify-content:center;gap:8px;overflow-x:visible;scrollbar-width:none}
.topbar-nav::-webkit-scrollbar{display:none}
.nav-group{position:relative;display:flex;flex-direction:column;align-items:center}
.nav-group::after{content:"";position:absolute;top:100%;left:0;right:0;height:10px;z-index:58}
.nav-group-label{font-size:.92rem;font-weight:800;color:var(--ink);padding:8px 18px;border-radius:999px;cursor:pointer;white-space:nowrap;letter-spacing:.02em;transition:background-color var(--motion-fast),color var(--motion-fast),box-shadow var(--motion-fast);user-select:none;display:flex;align-items:center;gap:5px}
.nav-group-label::after{content:"▾";font-size:.65rem;color:var(--muted-2);transition:transform var(--motion-fast)}
.nav-group:hover .nav-group-label{background:#f0ece4;color:var(--accent-dark)}
.nav-group:hover .nav-group-label::after{transform:rotate(180deg)}
.nav-group-dropdown{position:absolute;top:calc(100% + 8px);left:50%;transform:translateX(-50%);background:var(--paper-strong);border:1px solid var(--line);border-radius:var(--radius-md);padding:8px;display:none;flex-direction:column;gap:3px;box-shadow:var(--shadow-drop);z-index:60;min-width:140px;animation:dropIn .18s var(--motion-fast) both}
@keyframes dropIn{from{opacity:0;transform:translateX(-50%) translateY(-8px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
.nav-group:hover .nav-group-dropdown{display:flex}
.nav-group-dropdown .nav-link{text-align:center;justify-content:center;width:100%}
.nav-link{position:relative;padding:8px 15px;border:1px solid transparent;border-radius:999px;background:transparent;color:var(--muted);font-size:.84rem;font-weight:650;white-space:nowrap;transition:color var(--motion-fast),background-color var(--motion-fast),border-color var(--motion-fast),transform var(--motion-fast);display:inline-flex}
.nav-link:hover{color:var(--ink);background:#f0ece4;border-color:var(--line-soft);transform:translateY(-1px)}
.nav-link.active,.nav-link[aria-current="page"]{color:#fff;background:var(--ink);border-color:var(--ink);box-shadow:0 10px 24px rgba(17,24,23,.12)}
.nav-link.sim-link{color:var(--steel);border-color:rgba(63,81,88,.18)}
.nav-link.sim-link:hover{color:var(--accent);background:var(--accent-soft);border-color:rgba(143,47,34,.22)}
.nav-group-divider{width:1px;height:28px;background:var(--line);margin:0 6px;flex-shrink:0}

/* Search — only in browse view */
.browse-search{display:flex;align-items:center;gap:7px;background:#f6f2eb;border:1px solid transparent;border-radius:999px;padding:7px 13px;transition:border-color var(--motion-fast),background-color var(--motion-fast),box-shadow var(--motion-fast);min-width:180px;flex-shrink:0;margin-left:auto}
.browse-search:focus-within{border-color:rgba(143,47,34,.45);background:#fff;box-shadow:0 10px 28px rgba(143,47,34,.08)}
.browse-search input{border:none;outline:none;background:transparent;font-size:.82rem;width:120px;color:var(--ink)}
.browse-search input::placeholder{color:var(--muted-2)}
.browse-search svg{width:15px;height:15px;color:var(--muted-2);flex-shrink:0}
.clear-search{width:22px;height:22px;border:none;border-radius:50%;background:transparent;color:var(--muted-2);display:none;align-items:center;justify-content:center;transition:background-color var(--motion-fast),color var(--motion-fast),transform var(--motion-fast);flex-shrink:0}
.clear-search.visible{display:flex}
.clear-search:hover{background:var(--accent-soft);color:var(--accent);transform:rotate(90deg)}
.topbar-toggle{display:none;background:#fff;border:1px solid var(--line);border-radius:999px;width:40px;height:40px;color:var(--ink);font-size:1.1rem;align-items:center;justify-content:center;transition:transform var(--motion-fast),box-shadow var(--motion-fast),background-color var(--motion-fast)}
.topbar-toggle:hover{transform:translateY(-1px);box-shadow:0 12px 26px rgba(20,28,25,.1)}

/* ====== 主内容容器 ====== */
.main-content{flex:1;min-height:0;overflow:hidden;position:relative;display:flex;flex-direction:column}

/* ====== 门户视图 ====== */
.portal-view{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden}
.portal-view[hidden]{display:none}

.hero{position:relative;overflow:hidden;background:linear-gradient(135deg,#161d1b 0%,#243233 58%,#4e211b 100%);color:#fff;padding:56px 32px 48px;text-align:center;width:100%;flex-shrink:0}
.hero::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(255,255,255,.03) 1px,transparent 1px),linear-gradient(0deg,rgba(255,255,255,.024) 1px,transparent 1px);background-size:48px 48px;mask-image:linear-gradient(180deg,#000,transparent 80%)}
.hero-content{position:relative;z-index:1;max-width:780px;margin:0 auto;animation:heroIn .55s var(--motion-smooth) both}
@keyframes heroIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
.hero-kicker{display:inline-flex;align-items:center;gap:10px;font-size:.7rem;letter-spacing:.22em;text-transform:uppercase;color:rgba(255,255,255,.58);margin-bottom:16px;border:1px solid rgba(255,255,255,.14);padding:5px 16px;border-radius:999px;background:rgba(255,255,255,.05);backdrop-filter:blur(10px)}
.hero-kicker::before{content:"";width:6px;height:6px;border-radius:50%;background:#d96652;box-shadow:0 0 16px rgba(217,102,82,.8)}
.hero h1{font-family:"Noto Serif SC","Songti SC","SimSun",serif;font-size:clamp(2.4rem,5.5vw,4.8rem);font-weight:900;line-height:1.05;letter-spacing:.02em;margin-bottom:10px;text-shadow:0 2px 36px rgba(0,0,0,.3)}
.hero h1 .accent{color:#d96652}
.hero .portal-subtitle{font-size:1.05rem;color:rgba(255,255,255,.64);max-width:560px;margin:0 auto 0;line-height:1.8}

/* Portal entry cards */
.portal-entries{display:grid;grid-template-columns:1fr 1fr;gap:22px;padding:28px 32px;max-width:1060px;width:100%;flex-shrink:0}
.portal-entry{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:36px 28px;border:1px solid var(--line-soft);border-radius:var(--radius-lg);background:var(--paper);cursor:pointer;transition:transform var(--motion-smooth),box-shadow var(--motion-smooth),border-color var(--motion-fast);box-shadow:0 1px 0 rgba(17,24,23,.02);min-height:200px}
.portal-entry::before{content:"";position:absolute;left:24px;right:24px;top:0;height:3px;background:linear-gradient(90deg,transparent,var(--accent),transparent);transform:scaleX(0);transform-origin:left;transition:transform .46s var(--motion-smooth);z-index:2}
.portal-entry:hover{transform:translateY(-5px);box-shadow:var(--shadow-card);border-color:#d5ccc0}
.portal-entry:hover::before{transform:scaleX(1)}
.portal-entry h3{font-family:"Noto Serif SC","Songti SC","SimSun",serif;font-size:1.35rem;font-weight:900;color:var(--ink);margin-bottom:4px;letter-spacing:-.02em}
.portal-entry p{font-size:.88rem;color:var(--muted);line-height:1.65;margin-bottom:14px}
.portal-entry .entry-cta{display:inline-flex;align-items:center;gap:6px;font-size:.84rem;font-weight:800;color:var(--accent);transition:gap var(--motion-fast)}
.portal-entry:hover .entry-cta{gap:10px}
/* ====== 二级目录落地页 ====== */
.landing-view{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;animation:fadeIn .3s var(--motion-smooth) both}
.landing-view[hidden]{display:none}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.landing-header{text-align:center;padding:44px 32px 8px;width:100%;flex-shrink:0}
.landing-header h2{font-family:"Noto Serif SC","Songti SC","SimSun",serif;font-size:clamp(1.5rem,4vw,2.2rem);font-weight:900;color:var(--ink);margin-bottom:6px;letter-spacing:-.02em}
.landing-header .landing-sub{font-size:.92rem;color:var(--muted);line-height:1.7;max-width:520px;margin:0 auto}
.landing-back-row{width:100%;max-width:1060px;padding:8px 28px 0;flex-shrink:0}
.landing-back{display:inline-flex;align-items:center;gap:5px;padding:7px 15px;border:1px solid var(--line);border-radius:999px;background:var(--paper);color:var(--ink);font-size:.84rem;font-weight:650;cursor:pointer;white-space:nowrap;transition:all var(--motion-fast)}
.landing-back:hover{background:var(--ink);color:#fff;border-color:var(--ink);transform:translateX(-2px)}
.landing-grid{display:grid;gap:18px;padding:18px 32px 40px;max-width:1060px;width:100%;flex-shrink:0}
.landing-grid.cols-4{grid-template-columns:repeat(4,1fr)}
.landing-grid.cols-2{grid-template-columns:repeat(2,1fr)}
.landing-card{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:34px 22px;border:1px solid var(--line-soft);border-radius:var(--radius-lg);background:var(--paper);cursor:pointer;transition:transform var(--motion-smooth),box-shadow var(--motion-smooth),border-color var(--motion-fast);box-shadow:0 1px 0 rgba(17,24,23,.02);min-height:190px;animation:cardIn .48s var(--motion-smooth) forwards;animation-delay:var(--delay,0ms)}
.landing-card::before{content:"";position:absolute;left:22px;right:22px;top:0;height:3px;background:linear-gradient(90deg,transparent,var(--accent),transparent);transform:scaleX(0);transform-origin:left;transition:transform .46s var(--motion-smooth);z-index:2}
.landing-card:hover{transform:translateY(-5px);box-shadow:var(--shadow-card);border-color:#d5ccc0}
.landing-card:hover::before{transform:scaleX(1)}
.landing-card .lc-badge{position:absolute;top:14px;right:16px;padding:4px 10px;border-radius:999px;font-size:.68rem;font-weight:800;background:rgba(17,24,23,.06);color:var(--muted)}
.landing-card h3{font-family:"Noto Serif SC","Songti SC","SimSun",serif;font-size:1.15rem;font-weight:900;color:var(--ink);margin-bottom:6px;letter-spacing:-.02em}
.landing-card .lc-desc{font-size:.8rem;color:var(--muted);line-height:1.6;margin-bottom:12px}
.landing-card .lc-go{display:inline-flex;align-items:center;gap:5px;font-size:.82rem;font-weight:800;color:var(--accent);transition:gap var(--motion-fast)}
.landing-card:hover .lc-go{gap:9px}
.landing-card.accent-air{--accent-lc:#3a7bd5}.landing-card.accent-air::before{background:linear-gradient(90deg,transparent,#3a7bd5,transparent)}
.landing-card.accent-navy{--accent-lc:#1a6b8a}.landing-card.accent-navy::before{background:linear-gradient(90deg,transparent,#1a6b8a,transparent)}
.landing-card.accent-army{--accent-lc:#3d7a3d}.landing-card.accent-army::before{background:linear-gradient(90deg,transparent,#3d7a3d,transparent)}
.landing-card.accent-sim{--accent-lc:var(--steel)}.landing-card.accent-sim::before{background:linear-gradient(90deg,transparent,var(--steel),transparent)}

/* ====== 装备浏览视图 ====== */
.browse-view{flex:1;display:flex;flex-direction:column;overflow:hidden}
.browse-view[hidden]{display:none}
.browse-topbar{display:flex;align-items:center;gap:14px;padding:12px 28px;border-bottom:1px solid var(--line-soft);background:rgba(255,253,250,.8);flex-shrink:0;flex-wrap:wrap}
.browse-back{display:inline-flex;align-items:center;gap:5px;padding:7px 15px;border:1px solid var(--line);border-radius:999px;background:var(--paper);color:var(--ink);font-size:.84rem;font-weight:650;cursor:pointer;white-space:nowrap;transition:all var(--motion-fast)}
.browse-back:hover{background:var(--ink);color:#fff;border-color:var(--ink);transform:translateX(-2px)}
.browse-title{font-family:"Noto Serif SC","Songti SC","SimSun",serif;font-size:1.15rem;font-weight:800;color:var(--ink);flex:1}
.browse-filters{display:flex;gap:4px;flex-wrap:wrap}
.browse-filters .nav-link{font-size:.8rem;padding:6px 13px}

.results-bar{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:10px 28px;flex-shrink:0}
.results-title{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.results-title strong{font-family:"Noto Serif SC","Songti SC","SimSun",serif;font-size:1rem;color:var(--ink)}
.results-title span{font-size:.8rem;color:var(--muted)}
.results-hint{font-size:.74rem;color:var(--muted-2)}

.cards-scroll{flex:1;overflow-y:auto;padding:0 28px 28px;-webkit-overflow-scrolling:touch}
.cards-scroll::-webkit-scrollbar{width:6px}
.cards-scroll::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px}
.cat-heading{display:flex;align-items:center;gap:10px;margin:20px 0 8px;padding:8px 2px 12px;border-bottom:1px solid var(--line)}
.cat-heading h2{font-family:"Noto Serif SC","Songti SC","SimSun",serif;font-size:1.15rem;font-weight:800;color:var(--ink)}
.cat-heading .count{font-size:.72rem;color:var(--muted);background:#ebe6dd;padding:3px 10px;border-radius:999px}
.cards-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px;transition:opacity var(--motion-smooth),transform var(--motion-smooth),filter var(--motion-smooth)}
.cards-grid.is-filtering{opacity:.28;transform:translateY(10px);filter:blur(1px)}
.no-results{text-align:center;padding:60px 20px;color:var(--muted);border:1px dashed var(--line);border-radius:var(--radius-lg);background:rgba(255,253,250,.58);margin-top:20px}

/* Cards */
.card{position:relative;background:var(--paper);border:1px solid var(--line-soft);border-radius:var(--radius-lg);overflow:hidden;cursor:pointer;min-height:100%;box-shadow:0 1px 0 rgba(17,24,23,.02);transition:transform var(--motion-smooth),box-shadow var(--motion-smooth),border-color var(--motion-fast),background-color var(--motion-fast);opacity:0;animation:cardIn .48s var(--motion-smooth) forwards;animation-delay:var(--delay,0ms)}
@keyframes cardIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.card::before{content:"";position:absolute;left:18px;right:18px;top:0;height:2px;background:linear-gradient(90deg,transparent,var(--accent),transparent);transform:scaleX(0);transform-origin:left;transition:transform .46s var(--motion-smooth);z-index:2}
.card:hover,.card:focus-visible{transform:translateY(-5px);box-shadow:var(--shadow-card);border-color:#d5ccc0;background:#fff}
.card:hover::before,.card:focus-visible::before{transform:scaleX(1)}
.card:active,.card.is-pressed{transform:translateY(-2px) scale(.985)}
.card-img{position:relative;height:140px;overflow:hidden;background:#ece7dd;border-bottom:1px solid var(--line-soft)}
.card-img svg{width:100%;height:100%;display:block;transition:transform .7s var(--motion-smooth),filter .7s var(--motion-smooth);filter:saturate(.78) contrast(.98)}
.card:hover .card-img svg{transform:scale(1.035);filter:saturate(.95) contrast(1.02)}
.card-cat{position:absolute;top:12px;left:12px;z-index:1;padding:5px 10px;border-radius:999px;font-size:.7rem;background:rgba(17,24,23,.72);color:#fff;backdrop-filter:blur(8px);font-weight:700}
.card-body{padding:18px 20px 20px}
.card-eyebrow{font-size:.7rem;color:var(--accent);font-weight:800;letter-spacing:.12em;text-transform:uppercase;margin-bottom:6px}
.card-body h3{font-family:"Noto Serif SC","Songti SC","SimSun",serif;font-size:1.2rem;font-weight:900;color:var(--ink);line-height:1.32;margin-bottom:5px;letter-spacing:-.03em}
.card-body .model{font-size:.8rem;color:var(--muted-2);margin-bottom:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-body .excerpt{font-size:.86rem;color:var(--muted);line-height:1.7;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card-meta{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:16px;padding-top:13px;border-top:1px solid var(--line-soft);font-size:.76rem;color:var(--muted)}
.card-meta span:last-child{color:var(--accent);font-weight:800;transition:transform var(--motion-fast)}
.card:hover .card-meta span:last-child{transform:translateX(3px)}

/* ====== 详情弹窗 ====== */
.modal-overlay{position:fixed;inset:0;z-index:100;background:rgba(17,24,23,.72);backdrop-filter:blur(10px);display:flex;align-items:center;justify-content:center;padding:24px;visibility:hidden;opacity:0;pointer-events:none;transition:opacity var(--motion-smooth),visibility var(--motion-smooth)}
.modal-overlay.show{visibility:visible;opacity:1;pointer-events:auto}
.modal{background:var(--paper-strong);border-radius:26px;width:100%;max-width:940px;max-height:88vh;max-height:88dvh;overflow-y:auto;box-shadow:0 34px 92px rgba(0,0,0,.32);transform:translateY(28px) scale(.985);opacity:0;transition:transform var(--motion-smooth),opacity var(--motion-smooth);position:relative;border:1px solid rgba(255,255,255,.45)}
.modal-overlay.show .modal{transform:translateY(0) scale(1);opacity:1}
.modal::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:linear-gradient(90deg,transparent,var(--accent),transparent);opacity:.9}
.modal-close{position:sticky;top:18px;float:right;z-index:10;width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.86);border:1px solid var(--line);color:var(--ink);font-size:1.05rem;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:transform var(--motion-fast),background-color var(--motion-fast),color var(--motion-fast),border-color var(--motion-fast);margin:18px 18px -60px auto;box-shadow:0 12px 28px rgba(20,28,25,.1)}
.modal-close:hover{background:var(--accent);border-color:var(--accent);color:#fff;transform:rotate(90deg)}
.modal-img-wrap{position:relative;width:100%;height:280px;overflow:hidden;background:#ece7dd;border-radius:26px 26px 0 0;border-bottom:1px solid var(--line-soft)}
.modal-img-wrap svg{width:100%;height:100%;display:block;filter:saturate(.82)}
.modal-body{padding:28px 36px 38px}
.modal-tags{margin-bottom:14px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.modal-tag,.modal-status{padding:5px 11px;border-radius:999px;font-size:.74rem;font-weight:800;border:1px solid var(--line-soft)}
.modal-tag{background:#f4f0e8;color:var(--steel)}
.tag-active{background:#e8f3ea;color:#2d6e40;border-color:#cfe5d5}
.tag-test{background:#fff4da;color:#a16207;border-color:#efd38f}
.modal-body h2{font-family:"Noto Serif SC","Songti SC","SimSun",serif;font-size:clamp(1.7rem,4vw,2.6rem);font-weight:900;color:var(--ink);line-height:1.16;letter-spacing:-.04em;margin-bottom:6px}
.modal-body .model-name{font-size:.96rem;color:var(--muted);margin-bottom:22px}
.specs-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:1px;margin-bottom:24px;background:var(--line);border-radius:16px;overflow:hidden;border:1px solid var(--line)}
.spec-item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 13px;background:#fffdf9;font-size:.84rem}
.spec-label{color:var(--muted);font-weight:700;flex-shrink:0}
.spec-value{color:var(--ink);font-weight:750;text-align:right;word-break:break-word}

.source-open-btn{margin-left:auto;border:1px solid rgba(143,47,34,.26);background:var(--accent-soft);color:var(--accent-dark);padding:6px 12px;border-radius:999px;font-size:.74rem;font-weight:850;transition:transform var(--motion-fast),background-color var(--motion-fast),border-color var(--motion-fast)}

function normalizeText(value){return String(value||'').toLowerCase().replace(/\s+/g,'').trim()}
function flattenSearchText(value){
  if(Array.isArray(value))return value.map(flattenSearchText).join(' ');
  if(value&&typeof value==='object')return Object.keys(value).map(function(k){return k+' '+flattenSearchText(value[k])}).join(' ');
  return value==null?'':String(value);
}

}
function findItemById(id){for(var i=0;i<E.length;i++){if(E[i].id===id)return E[i]}return null}
function currentCatName(){return state.category==='all'?'全部':((catMeta[state.category]&&catMeta[state.category].name)||state.category)}
function safeClosest(el,selector){while(el&&el.nodeType===1){if(el.matches&&el.matches(selector))return el;el=el.parentElement}return null}
function escapeHtml(value){return String(value==null?'':value).replace(/[&<>"']/g,function(ch){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]})}
function getSources(x){return sourceCatalog[x.id]||[]}

var IMAGE_PLACEHOLDER='assets/shared/placeholders/image-placeholder.svg';
var VIDEO_PLACEHOLDER='assets/shared/placeholders/video-placeholder.svg';
function getMedia(id){return window.EQUIPMENT_MEDIA&&window.EQUIPMENT_MEDIA[id]?window.EQUIPMENT_MEDIA[id]:null}
function normalizeMediaStatus(status){return status==='ready'?'verified':(status==='placeholder'?'fallback':status)}
function fallbackImage(x,index){return {src:IMAGE_PLACEHOLDER,alt:x.n+' 图片槽位 '+(index+1)+'（暂无官方公开图片）',caption:'图片 '+(index+1)+' · 暂无官方公开素材',sourceName:'本地占位',sourceUrl:'',status:'fallback',slot:index+1}}
function getMediaImages(x){var media=getMedia(x.id),imgs=media&&Array.isArray(media.images)?media.images.slice(0,7):[];for(var i=imgs.length;i<7;i++)imgs.push(fallbackImage(x,i));return imgs.map(function(img,i){return Object.assign(fallbackImage(x,i),img||{})})}
function getMediaVideo(x){var media=getMedia(x.id),v=media&&media.video?media.video:{};return Object.assign({src:'',poster:VIDEO_PLACEHOLDER,title:x.n+' 官方公开视频槽位',sourceName:'本地占位',sourceUrl:'',status:'fallback',note:'暂无官方公开视频素材'},v)}
function realImageCount(x){return getMediaImages(x).filter(function(img){var s=normalizeMediaStatus(img.status);return s!=='fallback'&&s!=='missing'}).length}
function hasRealVideo(x){var v=getMediaVideo(x),s=normalizeMediaStatus(v.status);return !!(v.src&&s!=='fallback'&&s!=='missing')}
function hasWebVideo(x){var v=getMediaVideo(x),s=normalizeMediaStatus(v.status);return !!(!v.src&&s==='web_only'&&v.sourceUrl)}
function mediaBadgeText(x){return realImageCount(x)+' / 7 图 · '+(hasRealVideo(x)?'1 视频':(hasWebVideo(x)?'网页视频':'暂无视频'))}
function imgTag(img,cls){return '<img class="'+(cls||'media-img')+'" src="'+escapeHtml(img.src||IMAGE_PLACEHOLDER)+'" alt="'+escapeHtml(img.alt||img.caption||'装备图片')+'" loading="lazy" decoding="async" onerror="this.onerror=null;this.src=\''+IMAGE_PLACEHOLDER+'\';">'}
function mediaSourceHtml(item,type){
  var statusMap={verified:'已审核官方/央媒素材',ready:'已下载公开来源素材',web_only:'公开网页可观看，未下载本地视频',generated:'本地生成兜底素材',needs_review:'素材待复核',rejected:'来源不符合规则，未入库',fallback:'暂无官方公开素材，当前显示本地占位',placeholder:'暂无官方公开素材，当前显示本地占位',missing:'暂无官方公开素材，当前显示本地占位'};
  return '<span>'+escapeHtml(type)+' · '+escapeHtml(item.sourceName||(item.status==='web_only'?'公开视频网页':'本地占位'))+' · '+(statusMap[item.status]||statusMap.fallback)+'</span>'+(item.sourceUrl?'<a href="'+escapeHtml(item.sourceUrl)+'" target="_blank" rel="noopener noreferrer">查看来源</a>':'');
}
function buildImageStage(img,x,index){return '<figure class="media-figure">'+imgTag(img,'media-img')+'</figure>'}
function buildVideoStage(video,x){
  if(video.src){return '<video controls preload="metadata" poster="'+escapeHtml(video.poster||VIDEO_PLACEHOLDER)+'" title="'+escapeHtml(video.title||x.n+' 视频')+'"><source src="'+escapeHtml(video.src)+'" type="video/mp4">当前浏览器不支持视频播放。</video>'}
  if(video.status==='web_only'&&video.sourceUrl){return '<div class="media-missing web-only"><img src="'+escapeHtml(video.poster||VIDEO_PLACEHOLDER)+'" alt="" aria-hidden="true"><strong>公开视频需联网查看</strong><span>该素材页面可匿名访问，但未找到无需鉴权、无需绕过限制的稳定本地视频文件。</span><a href="'+escapeHtml(video.sourceUrl)+'" target="_blank" rel="noopener noreferrer">打开来源视频网页</a></div>'}
  return '<div class="media-missing"><img src="'+escapeHtml(video.poster||VIDEO_PLACEHOLDER)+'" alt="" aria-hidden="true"><strong>暂无官方公开视频</strong><span>当前装备的视频槽位已保留，待补充官方或央媒公开 720p 短片。</span></div>';
}
function buildMediaGallery(x){
  var imgs=getMediaImages(x),video=getMediaVideo(x),first=imgs[0];
  var thumbs=imgs.map(function(img,i){return '<button class="media-thumb '+(i===0?'active ':'')+(normalizeMediaStatus(img.status)==='fallback'||normalizeMediaStatus(img.status)==='missing'?'fallback':'')+'" type="button" data-media-type="image" data-media-index="'+i+'" aria-label="查看第 '+(i+1)+' 张图片">'+imgTag(img,'')+'<span class="thumb-label">图 '+(i+1)+'</span></button>'}).join('');
  thumbs+='<button class="media-thumb '+(!video.src?'fallback':'')+'" type="button" data-media-type="video" data-media-index="0" aria-label="查看视频">'+imgTag({src:video.poster||VIDEO_PLACEHOLDER,alt:video.title||x.n+' 视频封面'},'')+'<span class="play-mark">▶</span><span class="thumb-label">视频</span></button>';
  return '<section class="modal-media" data-equipment-id="'+escapeHtml(x.id)+'"><div class="media-stage" id="mediaStage">'+buildImageStage(first,x,0)+'</div><div class="media-thumbs" role="listbox" aria-label="媒体缩略图">'+thumbs+'</div><div class="media-source" id="mediaSource">'+mediaSourceHtml(first,'图片 1')+'</div></section>';
}
function pauseModalVideo(){if(!mCont||!mCont.querySelectorAll)return;var videos=mCont.querySelectorAll('video');for(var i=0;i<videos.length;i++)videos[i].pause&&videos[i].pause()}
function switchModalMedia(type,index){

// ====== FILTER ======
function filterItems(){
  var q=normalizeText(state.query);
  return E.filter(function(x){
    var matchCat=state.category==='all'||x.c===state.category;
    var matchQ=!q||normalizeText(getSearchText(x)).indexOf(q)>-1;
    return matchCat&&matchQ;
  });
}

// ====== RENDER ======
function render(items){
  items=items||filterItems();
  if(renderTimer)clearTimeout(renderTimer);
  grid.classList.add('is-filtering');
  renderTimer=setTimeout(function(){
    grid.innerHTML='';
    noR.hidden=items.length!==0;
    noR.style.display=items.length?'none':'block';
    if(items.length){
      var grouped={};
      items.forEach(function(x){if(!grouped[x.c])grouped[x.c]=[];grouped[x.c].push(x)});
      if(state.category==='all'&&state.query===''){
        Object.keys(grouped).forEach(function(c){
          var h=document.createElement('div');h.className='cat-heading';h.style.gridColumn='1/-1';
          var m=catMeta[c]||{name:c,icon:''};
          h.innerHTML='<h2>'+escapeHtml(m.name)+'</h2><span class="count">'+grouped[c].length+' 条报道</span>';
          grid.appendChild(h);
          grouped[c].forEach(function(x,i){grid.appendChild(card(x,i))});
        });
      }else{
        items.forEach(function(x,i){grid.appendChild(card(x,i))});
      }
    }
    updateSummary(items.length);
    requestAnimationFrame(function(){grid.classList.remove('is-filtering')});
  },130);
}

function updateSummary(count){
  var q=state.query.trim(),summary='当前显示 '+count+' 条 · '+currentCatName();
  if(q)summary='搜索"'+q+'" · '+currentCatName()+' · '+count+' 条结果';
  if(resultSummary)resultSummary.textContent=summary;
  if(clearSearch)clearSearch.classList.toggle('visible',!!q);
}

function card(x,i){
  var d=document.createElement('article');

// ====== RADAR ======
function drawRadar(canvas,labels,scores,color){
  var dpr=window.devicePixelRatio||1,css=250;
  canvas.width=css*dpr;canvas.height=css*dpr;canvas.style.width=css+'px';canvas.style.height=css+'px';
  var ctx=canvas.getContext('2d');ctx.setTransform(dpr,0,0,dpr,0,0);
  var w=css,h=css,cx=w/2,cy=h/2,r=86,n=labels.length,step=(Math.PI*2)/n;
  ctx.clearRect(0,0,w,h);
  ctx.fillStyle='#fffdf9';ctx.beginPath();ctx.arc(cx,cy,r+26,0,Math.PI*2);ctx.fill();
  for(var i=1;i<=4;i++){var gr=r/4*i;ctx.beginPath();
    for(var j=0;j<=n;j++){var a=step*j-Math.PI/2,x2=cx+gr*Math.cos(a),y2=cy+gr*Math.sin(a);j===0?ctx.moveTo(x2,y2):ctx.lineTo(x2,y2);}
    ctx.closePath();ctx.strokeStyle=i===4?'rgba(63,81,88,.22)':'rgba(63,81,88,.11)';ctx.lineWidth=i===4?1.25:1;ctx.stroke();}
  for(var i2=0;i2<n;i2++){var a2=step*i2-Math.PI/2;ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(cx+r*Math.cos(a2),cy+r*Math.sin(a2));ctx.strokeStyle='rgba(63,81,88,.11)';ctx.lineWidth=1;ctx.stroke();}
  ctx.beginPath();
  for(var i3=0;i3<n;i3++){var a3=step*i3-Math.PI/2,sc=scores[i3]/100,x3=cx+r*sc*Math.cos(a3),y3=cy+r*sc*Math.sin(a3);i3===0?ctx.moveTo(x3,y3):ctx.lineTo(x3,y3);}
  ctx.closePath();
  var rr=parseInt(color.slice(1,3),16),gg=parseInt(color.slice(3,5),16),bb=parseInt(color.slice(5,7),16);
  var grad=ctx.createRadialGradient(cx,cy,16,cx,cy,r);grad.addColorStop(0,'rgba('+rr+','+gg+','+bb+',.28)');grad.addColorStop(1,'rgba('+rr+','+gg+','+bb+',.10)');
  ctx.fillStyle=grad;ctx.fill();ctx.strokeStyle='rgba('+rr+','+gg+','+bb+',.88)';ctx.lineWidth=2;ctx.stroke();
  for(var i4=0;i4<n;i4++){var a4=step*i4-Math.PI/2,sc2=scores[i4]/100,x4=cx+r*sc2*Math.cos(a4),y4=cy+r*sc2*Math.sin(a4);
    ctx.beginPath();ctx.arc(x4,y4,4.5,0,Math.PI*2);ctx.fillStyle='#fffdf9';ctx.fill();ctx.lineWidth=2.5;ctx.strokeStyle=color;ctx.stroke();}
  ctx.fillStyle='#26312f';ctx.font='800 10.5px "Microsoft YaHei",sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
  for(var i5=0;i5<n;i5++){var a5=step*i5-Math.PI/2,lx=cx+(r+28)*Math.cos(a5),ly=cy+(r+28)*Math.sin(a5);ctx.fillText(labels[i5],lx,ly);}
}

// ====== MODAL ======
function openModal(x,triggerEl){
  if(!x)return;
  state.activeModalId=x.id;state.lastFocusedElement=triggerEl||document.activeElement;
  var pre=radarPresets[x.c]||radarPresets.airforce,rid='radarC';
  var sr=Object.keys(x.sp).map(function(k){return'<div class="spec-item"><span class="spec-label">'+escapeHtml(k)+'</span><span class="spec-value">'+escapeHtml(x.sp[k])+'</span></div>'}).join('');
  var ri=x.rd.map(function(s,i){return'<div class="radar-row"><div class="dot" style="background:'+pre.color+'"></div><span class="lbl">'+escapeHtml(pre.labels[i])+'</span><div class="bar-wrap"><div class="bar-fill" style="width:'+s+'%;background:'+pre.color+'"></div></div><span class="val">'+s+'</span></div>'}).join('');
  var dh=x.ds.map(function(p,i){var t=['概述','技术特点','战略意义'];return'<h4>'+(t[i]||'补充信息')+'</h4><p>'+escapeHtml(p)+'</p>'}).join('');
  var cm=catMeta[x.c]||{name:x.c,icon:''};
  mCont.innerHTML=buildMediaGallery(x)+'<div class="modal-body"><div class="modal-tags"><span class="modal-tag">'+escapeHtml(cm.name)+'</span><span class="modal-status '+(x.s==='active'?'tag-active':'tag-test')+'">'+(x.s==='active'?'● 现役':'◎ 测试中')+'</span><button class="source-open-btn" type="button" data-source-toggle>数据来源</button></div><h2 id="modalTitle">'+escapeHtml(x.n)+'</h2><div class="model-name">'+escapeHtml(x.fn)+'</div>'+buildSourcePanel(x)+'<div class="specs-grid">'+sr+'</div><div class="radar-block"><div class="radar-canvas-wrap"><canvas id="'+rid+'" width="250" height="250" aria-label="'+escapeHtml(x.n)+'五维能力雷达图"></canvas></div><div class="radar-info"><h4>五维能力观察</h4><div class="radar-note">基于公开报道要点转译为专题阅读指标，具体来源可点"数据来源"核对。</div>'+ri+'</div></div><div class="desc-block">'+dh+'</div></div>';
  mOver.classList.add('show');mOver.setAttribute('aria-hidden','false');
  document.body.classList.add('modal-open');
  mCont.parentElement.scrollTop=0;
  setTimeout(function(){var c=document.getElementById(rid);if(c)drawRadar(c,pre.labels,x.rd,pre.color);if(mClose)mClose.focus()},160);
}
function closeModal(){
  pauseModalVideo();
  if(!mOver.classList.contains('show'))return;
  mOver.classList.remove('show');mOver.setAttribute('aria-hidden','true');
  document.body.classList.remove('modal-open');
  state.activeModalId=null;
  var last=state.lastFocusedElement;
  setTimeout(function(){if(last&&document.body.contains(last))last.focus()},180);
}

// ====== NAV / FILTER UPDATES ======
function updateAllFilters(){
  // Topbar nav dropdown
  var topLinks=tNav.querySelectorAll('.nav-link');
  for(var i=0;i<topLinks.length;i++){
    var active=topLinks[i].dataset.cat===state.category;
    topLinks[i].classList.toggle('active',active);
    if(active)topLinks[i].setAttribute('aria-current','page');else topLinks[i].removeAttribute('aria-current');
  }
  // Browse view filters
  var bf=document.getElementById('browseFilters');
  if(bf){
    var flinks=bf.querySelectorAll('.nav-link');
    for(var j=0;j<flinks.length;j++){
      flinks[j].classList.toggle('active',flinks[j].dataset.cat===state.category);
    }
  }
}

function updateActiveNav(){
  // In portal or landing view, remove all active states from category links
  if(state.currentView==='portal'||state.currentView==='landing'){
    var allLinks=tNav.querySelectorAll('.nav-link[data-cat]');
    for(var i=0;i<allLinks.length;i++){
      allLinks[i].classList.remove('active');
      allLinks[i].removeAttribute('aria-current');
    }
    // Activate "全部" as default
    var allBtn=tNav.querySelector('.nav-link[data-cat="all"]');
    if(allBtn){allBtn.classList.add('active');allBtn.setAttribute('aria-current','page')}
  } else {
    updateAllFilters();
  }
}

// ====== INTERACTIONS ======
function scheduleRender(){clearTimeout(searchTimer);searchTimer=setTimeout(function(){render(filterItems())},90)}
function closeMenu(){document.body.classList.remove('menu-open');if(mBtn){mBtn.setAttribute('aria-expanded','false');mBtn.setAttribute('aria-label','打开分类菜单')}}
function toggleMenu(){var open=document.body.classList.toggle('menu-open');mBtn.setAttribute('aria-expanded',open?'true':'false');mBtn.setAttribute('aria-label',open?'关闭分类菜单':'打开分类菜单')}
function openItemFromCard(el){
  if(!el)return;var item=findItemById(el.dataset.id);if(!item)return;
  el.classList.add('is-pressed');setTimeout(function(){el.classList.remove('is-pressed');openModal(item,el)},120);

function setCategory(cat){
  cat=cat||'all';
  state.category=cat;
  if(state.currentView==='portal'||state.currentView==='landing'){showBrowse(cat)}
  else{updateAllFilters();render(filterItems());document.getElementById('cardsScroll').scrollTop=0}
}

  document.getElementById('entryEquip').addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();showLanding('equip')}});
  // Portal entry — simulation → landing
  document.getElementById('entrySim').addEventListener('click',function(){showLanding('sim')});
  document.getElementById('entrySim').addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();showLanding('sim')}});

  // Landing back button

  // Landing grid clicks

    var c=safeClosest(e.target,'.landing-card');if(!c)return;

  grid.addEventListener('keydown',function(e){if(e.key!=='Enter'&&e.key!==' ')return;var c=safeClosest(e.target,'.card[data-id]');if(c&&grid.contains(c)){e.preventDefault();openItemFromCard(c)}});

  // Topbar nav clicks
  tNav.addEventListener('click',function(e){
    var b=safeClosest(e.target,'.nav-link');if(!b)return;

  });

  });

  // Mobile menu
  mBtn.addEventListener('click',function(e){e.stopPropagation();toggleMenu()});
  document.addEventListener('click',function(e){if(!safeClosest(e.target,'#topbar')&&document.body.classList.contains('menu-open'))closeMenu()});

  // Keyboard
  document.addEventListener('keydown',function(e){
    if(e.key==='Escape'){
      if(mOver.classList.contains('show'))closeModal();
      else if(document.body.classList.contains('menu-open'))closeMenu();
      else if(state.currentView==='landing')showPortal();
      else if(state.currentView==='browse')showPortal();
      else if(state.query){sIn.value='';state.query='';render(filterItems())}
    }
  });
}

// ====== INIT ======
function init(){
  showPortal();
  updateAllFilters();
  bindEvents();
  // Pre-render equipment cards for instant switch
  render(E);
}
init();
</script>
</body>
</html>
